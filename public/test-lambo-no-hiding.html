<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Lambo - No Hiding</title>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
        }
        #info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-family: monospace;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="info">
        <h3>Lambo Model Test - No Object Hiding</h3>
        <p>All objects should be visible</p>
        <div id="object-count"></div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js';
        import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/loaders/GLTFLoader.js';
        import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);
        
        const camera = new THREE.PerspectiveCamera(
            45,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(10, 5, 10);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);
        
        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 10, 5);
        scene.add(directionalLight);
        
        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        
        // Grid
        const gridHelper = new THREE.GridHelper(20, 20);
        scene.add(gridHelper);
        
        // Load model
        const loader = new GLTFLoader();
        loader.load('/lambo5k.glb', (gltf) => {
            const model = gltf.scene;
            
            let totalObjects = 0;
            let meshCount = 0;
            let visibleCount = 0;
            
            // Count all objects and ensure all are visible
            model.traverse((child) => {
                totalObjects++;
                
                if (child.isMesh) {
                    meshCount++;
                }
                
                // Make sure everything is visible
                child.visible = true;
                visibleCount++;
                
                console.log(`Object: ${child.name || 'Unnamed'}, Type: ${child.type}, Visible: ${child.visible}`);
            });
            
            // Add to scene
            scene.add(model);
            
            // Update info
            document.getElementById('object-count').innerHTML = `
                Total objects: ${totalObjects}<br>
                Meshes: ${meshCount}<br>
                Visible: ${visibleCount}<br>
                Check console for details
            `;
            
            console.log('Model loaded successfully');
            console.log(`Total objects: ${totalObjects}, Meshes: ${meshCount}, All visible: ${visibleCount}`);
            
        }, undefined, (error) => {
            console.error('Error loading model:', error);
        });
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();
        
        // Handle resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
