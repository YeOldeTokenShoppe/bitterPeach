<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Debug Lambo Model</title>
    <style>
        body {
            margin: 0;
            background: #333;
            color: white;
            font-family: monospace;
            overflow: hidden;
        }
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 70%;
            height: 100vh;
        }
        #debug-info {
            position: fixed;
            top: 0;
            right: 0;
            width: 30%;
            height: 100vh;
            background: rgba(0,0,0,0.8);
            overflow-y: auto;
            padding: 20px;
            box-sizing: border-box;
        }
        .object-item {
            margin: 10px 0;
            padding: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 5px;
            cursor: pointer;
        }
        .object-item:hover {
            background: rgba(255,255,255,0.2);
        }
        .hidden {
            background: rgba(255,0,0,0.2);
        }
        .visible {
            background: rgba(0,255,0,0.2);
        }
        .controls {
            margin-bottom: 20px;
            padding: 10px;
            background: rgba(255,255,255,0.1);
        }
        button {
            margin: 5px;
            padding: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="debug-info">
        <h2>Lambo Model Debug</h2>
        <div class="controls">
            <button onclick="toggleAll(true)">Show All</button>
            <button onclick="toggleAll(false)">Hide All</button>
            <button onclick="toggleUFO()">Toggle UFO Objects</button>
            <button onclick="resetView()">Reset View</button>
        </div>
        <div id="object-list"></div>
    </div>

    <script type="module">
        import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.module.js';
        import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/loaders/GLTFLoader.js';
        import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.150.1/examples/jsm/controls/OrbitControls.js';

        // Global variables
        let scene, camera, renderer, controls;
        let modelObjects = [];
        const ufoObjectNames = ['Object_10', 'Object_11', 'Object_12', 'Object_13', 'Object_14', 'Object_15', 'Object_16', 'Object_17', 'Object_18'];

        // Initialize scene
        function init() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x222222);
            
            camera = new THREE.PerspectiveCamera(
                45,
                container.clientWidth / container.clientHeight,
                0.1,
                1000
            );
            camera.position.set(10, 5, 10);
            
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 5);
            scene.add(directionalLight);
            
            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            
            // Grid helper
            const gridHelper = new THREE.GridHelper(20, 20);
            scene.add(gridHelper);
            
            // Axes helper
            const axesHelper = new THREE.AxesHelper(5);
            scene.add(axesHelper);
            
            // Load model
            loadModel();
            
            // Handle resize
            window.addEventListener('resize', onWindowResize);
        }

        function loadModel() {
            const loader = new GLTFLoader();
            const debugInfo = document.getElementById('object-list');
            
            loader.load('/lambo5k.glb', (gltf) => {
                const model = gltf.scene;
                
                // Clear previous debug info
                debugInfo.innerHTML = '';
                modelObjects = [];
                
                // Traverse and document all objects
                model.traverse((child) => {
                    if (child.isMesh || child.isGroup) {
                        modelObjects.push(child);
                        
                        const div = document.createElement('div');
                        div.className = 'object-item ' + (child.visible ? 'visible' : 'hidden');
                        div.innerHTML = `
                            <strong>${child.name || 'Unnamed'}</strong><br>
                            Type: ${child.type}<br>
                            Visible: <span id="vis-${modelObjects.length-1}">${child.visible}</span><br>
                            ${child.isMesh ? `Geometry: ${child.geometry?.type || 'Unknown'}<br>` : ''}
                            ${child.material ? `Material: ${child.material.type}<br>` : ''}
                            ${child.parent ? `Parent: ${child.parent.name || 'Unnamed'}<br>` : ''}
                            Position: ${child.position.x.toFixed(2)}, ${child.position.y.toFixed(2)}, ${child.position.z.toFixed(2)}
                        `;
                        
                        // Make clickable to toggle visibility
                        div.onclick = () => toggleObject(modelObjects.length - 1);
                        
                        debugInfo.appendChild(div);
                        
                        // Check if this is a UFO object
                        if (ufoObjectNames.includes(child.name)) {
                            div.style.border = '2px solid orange';
                            div.innerHTML += '<br><em>UFO Object</em>';
                        }
                    }
                });
                
                // Add model to scene
                scene.add(model);
                
                // Log summary
                console.log('Model loaded:', {
                    totalObjects: modelObjects.length,
                    meshes: modelObjects.filter(o => o.isMesh).length,
                    groups: modelObjects.filter(o => o.isGroup).length,
                    animations: gltf.animations.length
                });
                
            }, (progress) => {
                console.log('Loading:', (progress.loaded / progress.total * 100).toFixed(2) + '%');
            }, (error) => {
                console.error('Error loading model:', error);
            });
        }

        function toggleObject(index) {
            const obj = modelObjects[index];
            if (obj) {
                obj.visible = !obj.visible;
                document.getElementById(`vis-${index}`).textContent = obj.visible;
                
                const divs = document.querySelectorAll('.object-item');
                divs[index].className = 'object-item ' + (obj.visible ? 'visible' : 'hidden');
            }
        }

        window.toggleAll = function(visible) {
            modelObjects.forEach((obj, i) => {
                obj.visible = visible;
                document.getElementById(`vis-${i}`).textContent = visible;
                
                const divs = document.querySelectorAll('.object-item');
                divs[i].className = 'object-item ' + (visible ? 'visible' : 'hidden');
            });
        };

        window.toggleUFO = function() {
            modelObjects.forEach((obj, i) => {
                if (ufoObjectNames.includes(obj.name)) {
                    obj.visible = !obj.visible;
                    document.getElementById(`vis-${i}`).textContent = obj.visible;
                    
                    const divs = document.querySelectorAll('.object-item');
                    divs[i].className = 'object-item ' + (obj.visible ? 'visible' : 'hidden');
                }
            });
        };

        window.resetView = function() {
            camera.position.set(10, 5, 10);
            controls.reset();
        };

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        // Start
        init();
        animate();
    </script>
</body>
</html>
