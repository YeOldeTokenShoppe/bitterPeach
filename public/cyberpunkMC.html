<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyberpunk Mission Control Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />

    <!-- Add link to Rajdhani font in the head -->
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

    <style>
      /* Ensure full height on all devices */
      html,
      body {
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background-color: #020617; /* Add dark background color */
        color: #e2e8f0;
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
      }

      body {
        font-family: 'Rajdhani', monospace;
        background-color: transparent !important;
        color: #67e8f9;
        display: flex;
        justify-content: center;
        width: 100%;
        position: relative;
        min-height: 100vh;
        overflow-y: auto;
        background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect fill="none" width="100" height="100"/><path d="M0 50 L100 50 M50 0 L50 100" stroke="%23133243" stroke-width="0.5" stroke-dasharray="2,3"/></svg>') !important;
      }

      @font-face {
        font-family: 'Rajdhani';
        font-style: normal;
        font-weight: 500;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/rajdhani/v15/LDI2apCSOBg7S-QT7pb0EPOqeef2kg.woff2) format('woff2');
      }

      @font-face {
        font-family: 'Rajdhani';
        font-style: normal;
        font-weight: 700;
        font-display: swap;
        src: url(https://fonts.gstatic.com/s/rajdhani/v15/LDI2apCSOBg7S-QT7pa8FvOqeef2kg.woff2) format('woff2');
      }

      .mission-control {
        width: 100%;
        max-width: 450px;
        min-height: 100vh; /* Use min-height instead of fixed height */
        background-image: 
          linear-gradient(to bottom, rgba(12, 22, 31, 0.92), rgba(5, 18, 27, 0.97)),
          url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><rect fill="none" width="200" height="200"/><circle cx="100" cy="100" r="90" stroke="%23133243" stroke-width="0.7" fill="none"/><circle cx="100" cy="100" r="60" stroke="%23133243" stroke-width="0.7" fill="none"/><circle cx="100" cy="100" r="30" stroke="%23133243" stroke-width="0.7" fill="none"/><path d="M30 100 L170 100 M100 30 L100 170" stroke="%23133243" stroke-width="0.7"/></svg>');
        display: flex;
        flex-direction: column;
        padding: 16px;
        border-left: 1px solid #154251;
        border-right: 1px solid #154251;
        box-shadow:
          0 0 15px rgba(6, 182, 212, 0.15),
          inset 0 0 30px rgba(6, 182, 212, 0.07);
        overflow-y: auto;
        overflow-x: hidden; /* Hide horizontal scrollbar */
        position: relative;
        z-index: 1;
        box-sizing: border-box;
      }

      .mission-control::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 5px;
        background: linear-gradient(to right, transparent, #00f7ff, #00a2ff, #00f7ff, transparent);
        opacity: 0.7;
        box-shadow: 0 0 15px rgba(0, 247, 255, 0.7);
        z-index: 10;
      }

      .mission-control::after {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(to right, transparent, #00f7ff, #00a2ff, #00f7ff, transparent);
        opacity: 0.7;
        z-index: 10;
      }

      /* Fix panel header height */
      .panel-header {
        min-height: 70px;
        height: 70px;
        max-height: 70px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        margin-bottom: 16px;
        padding-bottom: 8px;
        position: relative;
        border-bottom: none;
      }

      .panel-header::before {
        content: "";
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(to right, transparent, #00f7ff, #00a2ff, #00f7ff, transparent);
        opacity: 0.7;
      }

      .panel-header::after {
        content: "";
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: -10px;
        width: 20px;
        height: 20px;
        background-color: #071d29;
        border: 1px solid #154251;
        border-radius: 50%;
        box-shadow: 0 0 8px rgba(0, 247, 255, 0.5), inset 0 0 4px rgba(0, 247, 255, 0.3);
        z-index: 5;
      }

      /* Fix panel title height */
      .panel-title {
        height: 28px;
        line-height: 1.2;
        margin: 0;
        padding: 0;
        font-size: 1.4rem;
        letter-spacing: 0.2em;
        font-weight: bold;
        font-family: 'Rajdhani', sans-serif;
        color: #00f7ff;
        text-shadow:
          0 0 5px rgba(0, 247, 255, 0.7),
          0 0 10px rgba(0, 162, 255, 0.5);
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
      }

      .panel-title::before,
      .panel-title::after {
        content: "//";
        position: absolute;
        color: #00a2ff;
        font-size: 1.2rem;
        opacity: 0.8;
      }

      .panel-title::before {
        left: 20px;
      }
      
      .panel-title::after {
        right: 20px;
      }

      .panel-subtitle {
        font-size: 0.85rem;
        line-height: 1.4;
        color: #d1e2e3;
        text-shadow: 0 0 5px rgba(0, 247, 255, 0.5);
        letter-spacing: 0.1em;
        margin-top: 4px;
        font-family: 'Rajdhani', sans-serif;
        font-weight: 500;
      }

      .video-call {
        margin-bottom: 20px;
        background-color: #081720;
        border: 1px solid #154251;
        border-radius: 0;
        overflow: visible;
        position: relative;
        z-index: 50;
        box-shadow: 0 0 15px rgba(0, 247, 255, 0.15);
      }

      .video-call::before {
        content: "";
        position: absolute;
        top: -5px;
        left: -5px;
        right: -5px;
        bottom: -5px;
        border: 1px solid #154251;
        border-radius: 2px;
        z-index: -1;
        pointer-events: none;
      }

      .video-header {
        background-color: #0c1e2a;
        padding: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #154251;
        font-size: 0.75rem;
        font-family: 'Rajdhani', sans-serif;
        position: relative;
      }

      .video-header::before,
      .video-header::after {
        content: "";
        position: absolute;
        width: 8px;
        height: 8px;
        background-color: #081720;
        border: 1px solid #154251;
        top: 50%;
        transform: translateY(-50%);
        z-index: 2;
      }

      .video-header::before {
        left: -4px;
        border-radius: 0 0 2px 0;
      }

      .video-header::after {
        right: -4px;
        border-radius: 0 0 0 2px;
      }

      .video-status {
        height: 10px;
        width: 10px;
        border-radius: 50%;
        background-color: #4b5563;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.5), inset 0 0 3px rgba(0, 0, 0, 0.5);
      }

      .video-status.active {
        background-color: #ef4444;
        animation: pulse 2s infinite;
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.7), inset 0 0 5px rgba(239, 68, 68, 0.5);
      }

      /* Default video display state - always expanded on non-mobile screens */
      .video-display {
        height: 180px;
        position: relative;
        background: linear-gradient(45deg, #041c2c, #000);
        overflow: hidden;
        transition: height 0.3s ease-out;
        border-bottom: 1px solid #154251;
      }

      /* Media query for shorter screens (likely mobile) - allow collapsing */
      @media (max-height: 700px) {
        /* Default collapsed height on mobile when inactive */
        .video-display:not(.active) {
          height: 40px;
        }

        /* When active, maintain original height */
        .video-display.active {
          height: 180px !important;
        }

        /* Add expand/collapse indicators */
        .video-display::before {
          content: "▼";
          position: absolute;
          right: 8px;
          top: 10px;
          color: #67e8f9;
          font-size: 0.7rem;
          opacity: 0.8;
          z-index: 20;
          pointer-events: none;
          transition: transform 0.3s ease-out;
        }

        .video-display.active::before {
          transform: rotate(180deg);
          top: 8px;
        }

        /* Add touch hint on first load */
        .video-display:not(.touched):not(.active)::after {
          animation: pulse 2s infinite;
        }
      }

      /* SitePal loading logo */
      .waiting_logo {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 14;
      }

      #sitepal-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 5;
        display: none;
        -webkit-overflow-scrolling: touch;
      }

      #sitepal-container.active {
        display: block;
        z-index: 30;
      }

      /* Hide SitePal loading elements */
      #sitepal-container .waiting_logo,
      #sitepal-container .loading-container,
      #sitepal-container [id*="loading"],
      #sitepal-container [class*="loading"] {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
      }

      /* Style for video feed and transmission effect */
      #video-feed {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 10;
      }

      #deadAir {
        z-index: 20;
        position: relative;
      }

      /* Make sure SitePal player is visible */
      #vhss_aiPlayer {
        width: 100% !important;
        height: 100% !important;
        z-index: 20 !important;
      }

      /* Ensure video stays behind sitepal when active */
      #video-feed video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* Add transition and initial z-index */
        transition: opacity 0.5s ease-out;
        z-index: 15; /* Ensure it's above sitepal-container (z-index 10) during effect */
        display: none; /* Hide initially */
      }

      .video-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: 
          linear-gradient(rgba(6, 182, 212, 0.03), rgba(6, 182, 212, 0.01)),
          repeating-linear-gradient(
            transparent,
            transparent 1px,
            rgba(6, 182, 212, 0.05) 1px,
            rgba(6, 182, 212, 0.05) 2px
          );
        background-size: 100% 2px;
        pointer-events: none;
        z-index: 10;
        display: none;
        -webkit-overflow-scrolling: touch;
      }

      /* 3D video overlay */
      .threedy-mode .video-overlay {
        background-image: repeating-linear-gradient(
          transparent,
          transparent 1px,
          rgba(255, 0, 64, 0.05) 1px,
          rgba(0, 180, 255, 0.05) 2px
        );
        background-size: 100% 2px;
        box-shadow:
          inset -2px 0 10px rgba(255, 0, 64, 0.1),
          inset 2px 0 10px rgba(0, 180, 255, 0.1);
      }

      /* 80s video overlay */
      .eighties-active .video-overlay {
        background-image: repeating-linear-gradient(
          transparent,
          transparent 1px,
          rgba(217, 70, 239, 0.05) 1px,
          rgba(34, 211, 238, 0.05) 2px
        );
        background-size: 100% 2px;
        box-shadow: inset 0 0 20px rgba(217, 70, 239, 0.1);
        opacity: 0.8;
      }

      .video-feed {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #4b5563;
      }

      .video-feed.offline::before,
      .video-feed.offline::after {
        content: "";
        position: absolute;
        background-color: #1f2937;
      }

      .video-feed.offline::before {
        width: 100%;
        height: 1px;
        top: 50%;
      }

      .video-feed.offline::after {
        height: 100%;
        width: 1px;
        left: 50%;
      }

      .self-view {
        position: absolute;
        bottom: 8px;
        right: 8px;
        width: 60px;
        height: 40px;
        background-color: #081720;
        border: 1px solid #154251;
        border-radius: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        z-index: 20; /* Ensure it stays above SitePal elements */
      }

      .self-view img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .self-view .emoji-placeholder {
        font-size: 1.75rem;
        color: #67e8f9;
        text-shadow: 0 0 5px #06b6d4;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        line-height: 1;
      }

      .live-indicator {
        position: absolute;
        bottom: 8px;
        left: 8px;
        font-size: 0.75rem;
        color: #22d3ee;
        animation: pulse 2s infinite;
      }

      .video-controls {
        background-color: #0c1e2a;
        padding: 6px 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: relative;
        z-index: 100;
      }

      .call-button {
        font-size: 0.75rem;
        font-family: 'Rajdhani', sans-serif;
        font-weight: 700;
        padding: 6px 12px;
        border-radius: 0;
        cursor: pointer;
        background-color: #0c1e2a;
        color: #22d3ee;
        border: 1px solid #154251;
        box-shadow: 0 0 5px rgba(6, 182, 212, 0.3);
        position: relative;
        z-index: 101;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      .call-button.disconnect {
        color: #f87171;
        border-color: #7f1d1d;
        box-shadow: 0 0 5px rgba(220, 38, 38, 0.3);
      }

      .station-select {
        background-color: #0c1e2a;
        color: #22d3ee;
        font-size: 0.75rem;
        font-family: 'Rajdhani', sans-serif;
        font-weight: 500;
        padding: 4px 8px;
        border: 1px solid #154251;
        border-radius: 0;
        box-shadow: 0 0 3px rgba(6, 182, 212, 0.2);
        position: relative;
        z-index: 101;
        cursor: pointer;
      }

      .station-select option {
        background-color: #081720;
        color: #22d3ee;
      }

      .button-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
      }

      .control-button {
        background-color: #081720;
        border: 1px solid #154251;
        border-radius: 0;
        padding: 12px;
        color: #67e8f9;
        font-family: 'Rajdhani', sans-serif;
        font-weight: 500;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center; /* Vertically center content */
        min-height: 65px; /* Ensure consistent minimum height */
        cursor: pointer;
        transition: all 0.3s;
        position: relative;
        overflow: hidden;
        box-shadow: 0 0 5px rgba(6, 182, 212, 0.15), inset 0 0 10px rgba(6, 182, 212, 0.05);
      }

      .control-button::before {
        content: "";
        position: absolute;
        top: -1px;
        left: -1px;
        right: -1px;
        height: 2px;
        background: linear-gradient(to right, transparent, #00f7ff, transparent);
        opacity: 0.7;
        transition: all 0.3s;
      }

      .control-button::after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: -1px;
        right: -1px;
        height: 1px;
        background: linear-gradient(to right, transparent, #00a2ff, transparent);
        opacity: 0.3;
        transition: all 0.3s;
      }

      .control-button:hover {
        background-color: #0a1f2c;
        box-shadow: 0 0 10px rgba(6, 182, 212, 0.3), inset 0 0 15px rgba(6, 182, 212, 0.1);
      }

      .control-button:hover::before {
        opacity: 1;
        background: linear-gradient(to right, transparent, #00f7ff, #00a2ff, #00f7ff, transparent);
      }

      .control-button:hover::after {
        opacity: 0.7;
        background: linear-gradient(to right, transparent, #00a2ff, #00f7ff, #00a2ff, transparent);
      }

      .button-prefix {
        font-size: 0.75rem;
        line-height: 1.3;
        margin-bottom: 4px;
        opacity: 0.7;
        color: #6cadbd;
        letter-spacing: 0.1em;
      }

      .button-label {
        font-weight: 700;
        letter-spacing: 0.1em;
        font-size: 0.95rem;
        line-height: 1.3;
        text-transform: uppercase;
      }

      .button-indicator {
        width: 32px;
        height: 3px;
        margin-top: 6px;
        background-color: #154251;
        border-radius: 0;
        position: relative;
        overflow: hidden;
      }

      .button-indicator::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(to right, transparent, #00f7ff, #00a2ff, #00f7ff, transparent);
        opacity: 0.5;
        transform: translateX(-100%);
        transition: transform 0.5s ease-in-out;
      }

      .control-button:hover .button-indicator::before {
        transform: translateX(100%);
      }

      .toggle-section {
        margin-bottom: 16px;
        background-color: #081720;
        padding: 14px;
        border-radius: 0;
        border: 1px solid #154251;
        box-shadow: 0 0 5px rgba(6, 182, 212, 0.15), inset 0 0 10px rgba(0, 0, 0, 0.5);
        position: relative;
      }

      .toggle-section::before {
        content: "";
        position: absolute;
        top: -1px;
        left: 20%;
        right: 20%;
        height: 1px;
        background: linear-gradient(to right, transparent, #00f7ff, #00a2ff, #00f7ff, transparent);
        opacity: 0.7;
      }

      .toggle-section::after {
        content: "";
        position: absolute;
        bottom: -1px;
        left: 20%;
        right: 20%;
        height: 1px;
        background: linear-gradient(to right, transparent, #00f7ff, #00a2ff, #00f7ff, transparent);
        opacity: 0.4;
      }

      .toggle-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .toggle-row .label-switch-container {
        display: flex;
        width: 100%;
        justify-content: space-between;
        align-items: center;
      }

      .toggle-row:last-child {
        margin-bottom: 0;
      }

      .toggle-label {
        font-size: 0.875rem;
        line-height: 1.4;
        font-family: 'Rajdhani', sans-serif;
        font-weight: 500;
        letter-spacing: 0.05em;
        color: #a2d5df;
      }

      .toggle-switch {
        width: 48px;
        height: 24px;
        background-color: #0c1e2a;
        border-radius: 0;
        position: relative;
        padding: 2px;
        cursor: pointer;
        transition: background-color 0.3s;
        border: 1px solid #154251;
        overflow: hidden;
      }

      .toggle-switch::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: repeating-linear-gradient(
          45deg,
          transparent,
          transparent 2px,
          rgba(0, 247, 255, 0.1) 2px,
          rgba(0, 247, 255, 0.1) 4px
        );
        opacity: 0.2;
        pointer-events: none;
      }

      .toggle-switch.active {
        background-color: #173e4e;
        box-shadow: 0 0 5px rgba(6, 182, 212, 0.5), inset 0 0 10px rgba(6, 182, 212, 0.3);
      }

      .toggle-switch.eighties.active {
        background-color: #4c1d95;
        box-shadow: 0 0 5px rgba(147, 51, 234, 0.5);
      }

      .toggle-switch.music.active {
        background-color: #0c4954;
        box-shadow: 0 0 5px rgba(6, 182, 212, 0.7);
      }

      .toggle-switch.music:hover {
        box-shadow: 0 0 8px rgba(6, 182, 212, 0.8);
      }

      .toggle-handle {
        width: 18px;
        height: 18px;
        background-color: #67e8f9;
        border-radius: 0;
        position: absolute;
        top: 2px;
        left: 2px;
        transition: transform 0.3s;
        box-shadow: 0 0 5px rgba(0, 247, 255, 0.7), inset 0 0 3px rgba(0, 0, 0, 0.3);
      }

      .toggle-switch.active .toggle-handle {
        transform: translateX(24px);
        background-color: #00f7ff;
      }

      .leaderboard-header {
        width: 100%;
        background-color: #0c1e2a;
        border-radius: 0;
        border: 1px solid #154251;
        padding: 6px 8px;
        font-family: 'Rajdhani', sans-serif;
        color: #22d3ee;
        font-size: 0.75rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
        cursor: pointer;
        box-shadow: 0 0 5px rgba(6, 182, 212, 0.15);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-weight: 700;
        position: relative;
      }

      .leaderboard-header::before {
        content: "";
        position: absolute;
        top: -1px;
        left: 10%;
        right: 10%;
        height: 1px;
        background: linear-gradient(to right, transparent, #00f7ff, #00a2ff, #00f7ff, transparent);
        opacity: 0.7;
      }

      .leaderboard-content {
        background-color: #081720;
        border-radius: 0;
        border: 1px solid #154251;
        padding: 8px;
        font-family: 'Rajdhani', sans-serif;
        color: #22d3ee;
        font-size: 0.875rem;
        margin-bottom: 16px;
        box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.7);
        background-image: 
          linear-gradient(to bottom, #0c1721, #0a0f16),
          repeating-linear-gradient(
            45deg,
            transparent,
            transparent 10px,

      // Function to stop orientation video and clean up
      function stopOrientationVideo() {
        const orientationVideo = document.getElementById("orientation-video");
        const deadAir = document.getElementById("deadAir");
        const offlineDisplay = document.getElementById("offline-display");
        const transcriptToggleBtn = document.getElementById("transcript-toggle-btn");
        const loadingIndicator = document.querySelector(".video-loading-indicator");
        const transcriptContainer = document.getElementById("transcript-container");
        const ccButton = document.getElementById("cc-button");

        if (!orientationVideo) return;

        // First stop video playback and fully release resources
        orientationVideo.pause();
        orientationVideo.currentTime = 0;
        orientationVideo.src = "";  // Empty source
        orientationVideo.removeAttribute("src");
        orientationVideo.load();  // Force browser to release resources
        
        // Remove event listeners to prevent memory leaks
        orientationVideo.onloadstart = null;
        orientationVideo.onloadedmetadata = null;
        orientationVideo.onloadeddata = null;
        orientationVideo.oncanplay = null;
        orientationVideo.oncanplaythrough = null;
        orientationVideo.onerror = null;
        orientationVideo.onended = null;
        orientationVideo.onplaying = null;

        // Remove CC button pulse animation and hide it
        if (transcriptToggleBtn) {
          transcriptToggleBtn.classList.remove("pulse-attention");
          transcriptToggleBtn.style.display = "none";
        }

        // Hide transcript if visible
        if (transcriptContainer && transcriptContainer.style.display !== "none") {
          transcriptContainer.style.display = "none";
        }

        // Clear transcript interval
        if (window.transcriptState && window.transcriptState.interval) {
          clearInterval(window.transcriptState.interval);
          window.transcriptState.interval = null;
        }

        // Re-enable the toggles
        if (typeof enableToggles === "function" && !isCallActive) {
          enableToggles();
        }

        // Remove loading indicator if present
        if (loadingIndicator) {
          loadingIndicator.remove();
        }

        // Start a quick fade-out transition
        orientationVideo.style.opacity = "0";
        orientationVideo.style.transition = "opacity 0.3s ease-in-out";

        // After fade transition completes, remove the video and clean up
        setTimeout(() => {
          // Remove the video element
          orientationVideo.remove();
          // 🔇 Fully stop and clean up deadAir playback
          const deadAirCleanup = document.getElementById("deadAir");
          if (deadAirCleanup) {
            console.log("🛑 Ensuring deadAir is stopped after orientation...");
            deadAirCleanup.pause();
            deadAirCleanup.currentTime = 0;
            deadAirCleanup.style.opacity = "0";
            deadAirCleanup.style.display = "none";

          const signalButton = document.querySelector('.control-button[data-action="signal"]');

            if (buttonLabel) {

          // Remove cc button after orientation video stops

            ccButton.remove();

          window.orientationComplete = true;
        }, 300); // Match the CSS transition duration

      // Transcript elements and state

      const transcriptToggleBtn = document.getElementById("transcript-toggle-btn");
      const transcriptHeader = document.getElementById("transcript-header");
      const transcriptContent = document.getElementById("transcript-content");
      const languageSelect = document.getElementById("language-select");
      const transcriptExpandIcon = document.querySelector(".transcript-expand-icon");

      const transcriptState = {
        isVisible: false,
        isCollapsed: false,
        currentLanguage: "en",
        currentSegmentIndex: 0,
        interval: null,
        updateTranscriptFn: null, // Reference to the transcript update function for cleanup
      };

      // Initialize transcript functionality
      function initTranscript() {
        // Ensure transcript starts expanded
        if (transcriptContent) transcriptContent.classList.remove("collapsed");
        if (transcriptExpandIcon) transcriptExpandIcon.classList.remove("collapsed");
        transcriptState.isCollapsed = false;

        // Show the transcript toggle button when video is playing
        transcriptToggleBtn.style.display = "flex";

        // Set up event listeners
        transcriptToggleBtn.addEventListener("click", toggleTranscriptVisibility);
        transcriptHeader.addEventListener("click", toggleTranscriptCollapse);
        languageSelect.addEventListener("change", function () {
          transcriptState.currentLanguage = this.value;
          loadTranscript(transcriptState.currentLanguage);
        });

        // Load initial transcript
        loadTranscript(transcriptState.currentLanguage);
      }

      // Toggle transcript visibility
      function toggleTranscriptVisibility() {
        transcriptState.isVisible = !transcriptState.isVisible;

        if (transcriptState.isVisible) {
          transcriptContainer.style.display = "block";
          transcriptToggleBtn.classList.add("active");
          // Start the transcript highlight simulation if not already running
          if (!transcriptState.interval) {
            transcriptState.currentSegmentIndex = 0;
            startTranscriptHighlight();
          }
        } else {
          transcriptContainer.style.display = "none";
          transcriptToggleBtn.classList.remove("active");
          // Stop the highlight simulation when hidden
          if (transcriptState.interval) {
            clearInterval(transcriptState.interval);
            transcriptState.interval = null;
          }
        }
      }

      function toggleTranscriptCollapse() {
        transcriptState.isCollapsed = !transcriptState.isCollapsed;

        if (transcriptState.isCollapsed) {
          transcriptContent.classList.add("collapsed");
          transcriptExpandIcon.classList.add("collapsed");
        } else {
          transcriptContent.classList.remove("collapsed");
          transcriptExpandIcon.classList.remove("collapsed");
        }

      function loadTranscript(language) {
        // Clear current transcript
        transcriptContent.innerHTML = "";

        const transcript = transcriptData[language] || transcriptData.en;

        // Create transcript segments
        transcript.forEach((segment, index) => {
          const segmentElement = document.createElement("div");
          segmentElement.classList.add("transcript-segment");
          segmentElement.setAttribute("data-time", segment.time);
          segmentElement.textContent = segment.text;

          // Highlight the first segment by default
          if (index === 0) {
            segmentElement.classList.add("active");
          }

          transcriptContent.appendChild(segmentElement);
        });
      }

            const activeSegment = segments[activeIndex];
            const containerRect = transcriptContent.getBoundingClientRect();

            if (segmentRect.bottom > containerRect.bottom || segmentRect.top < containerRect.top) {

            }

            // Update current segment index
            transcriptState.currentSegmentIndex = activeIndex;
          }
        };

            // Skip if transcript is not visible or collapsed
            if (!transcriptState.isVisible || transcriptState.isCollapsed) return;

            const segments = document.querySelectorAll(".transcript-segment");
            if (segments.length === 0) return;

            // Clear active class from all segments
            segments.forEach(segment => segment.classList.remove("active"));

            // Add active class to current segment
            segments[transcriptState.currentSegmentIndex].classList.add("active");

            // Auto-scroll to keep active segment visible
            const activeSegment = segments[transcriptState.currentSegmentIndex];
            const containerRect = transcriptContent.getBoundingClientRect();
            const segmentRect = activeSegment.getBoundingClientRect();

            if (segmentRect.bottom > containerRect.bottom || segmentRect.top < containerRect.top) {
              activeSegment.scrollIntoView({ behavior: "smooth", block: "center" });
            }

            // Advance to next segment
            transcriptState.currentSegmentIndex =
              (transcriptState.currentSegmentIndex + 1) % segments.length;
          }, 2500); // Slightly faster than before for better responsiveness
        }

              disconnectSitePal();
            }
            break;

            try {
              initSitePal();
              console.log("✅ SitePal initialization triggered");

              console.error("❌ Error initializing SitePal:", error);
            }
            break;
          case "ACTIVATE_SITEPAL_MIC":
            console.log("🎤 Received ACTIVATE_SITEPAL_MIC message from parent");

            try {
              // First prime audio if needed (for iOS)
              if (typeof saySilent === "function") {
                saySilent(0);
                console.log("🔇 Audio primed with saySilent(0)");
              }
              
              // Then activate the microphone
              if (typeof AI_vhost_api === "function") {
                AI_vhost_api("startListening");
                console.log("🎤 SitePal microphone activated");
                
                // Notify parent that microphone is active
                window.parent.postMessage({
                  type: "MICROPHONE_ACTIVATED",
                  status: "active"
                }, "*");
              } else {
                console.warn("⚠️ AI_vhost_api not available for activating microphone");
              }
            } catch (error) {
              console.error("❌ Error activating SitePal microphone:", error);
            }
            break;
          // ... other cases ...
        }
      }

      // Ensure we're listening for messages
      window.addEventListener("message", handlePostMessage);
