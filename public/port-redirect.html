<!DOCTYPE html>
<html>
  <head>
    <title>Redirecting...</title>
    <script>
      // Get the current path and query string
      const path = window.location.pathname;
      const query = window.location.search;

      // Create the new URL with port 3001
      const newUrl = `http://localhost:3001${path}${query}`;

      // Redirect to the new URL
      window.location.href = newUrl;
    </script>
  </head>
  <body>
    <h1>Redirecting to port 3001...</h1>
    <p>
      If you are not redirected automatically, please click
      <a id="redirect-link" href="#">here</a>.
    </p>

    <script>
      // Set the href for the manual redirect link
      document.getElementById(
        "redirect-link"
      ).href = `http://localhost:3001${window.location.pathname}${window.location.search}`;
    </script>
  </body>
</html>
