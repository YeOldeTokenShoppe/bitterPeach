<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyberpunk Mission Control Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <!-- Firebase SDKs (Add these) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-firestore-compat.js"></script>

    <style>
      /* Ensure full height on all devices */
      html,
      body {
        height: 100vh;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: monospace;
        background-color: transparent !important;
        color: #67e8f9;
        display: flex;
        justify-content: center;
        width: 100%;
        position: relative;
        min-height: 100vh; /* Minimum height to ensure it fills viewport */
        overflow-y: auto; /* Allow vertical scrolling if needed */
      }

      .mission-control {
        width: 100%;
        max-width: 450px;
        min-height: 100vh; /* Use min-height instead of fixed height */
        background-image: linear-gradient(to bottom, #0f172a, #1e293b);
        display: flex;
        flex-direction: column;
        padding: 16px;
        border-left: 1px solid #0e7490;
        border-right: 1px solid #0e7490;
        box-shadow: 0 0 15px rgba(6, 182, 212, 0.3),
          inset 0 0 10px rgba(6, 182, 212, 0.1);
        overflow-y: auto;
        overflow-x: hidden; /* Hide horizontal scrollbar */
        position: relative;
        z-index: 1;
        box-sizing: border-box;
      }

      /* Fix panel header height */
      .panel-header {
        min-height: 60px;
        height: 60px;
        max-height: 60px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        margin-bottom: 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid #0e7490;
      }

      /* Fix panel title height */
      .panel-title {
        height: 22px;
        line-height: 1.2;
        margin: 0;
        padding: 0;
        font-size: 1.05rem;
        letter-spacing: 0.2em;
        font-weight: bold;
        color: #67e8f9;
        text-shadow: -2px 0 #ff0040, 2px 0 #00b4ff;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
      }

      .panel-subtitle {
        font-size: 0.75rem;
        line-height: 1.4;
        color: white;
        text-shadow: -1px 0 #ff0040, 1px 0 #00b4ff;
        letter-spacing: 0.1em;
        margin-top: 4px;
      }

      .video-call {
        margin-bottom: 16px;
        background-color: #000;
        border: 1px solid #134e4a;
        border-radius: 4px;
        overflow: visible;
        position: relative;
        z-index: 50;
      }

      .video-header {
        background-color: #111827;
        padding: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #134e4a;
        font-size: 0.75rem;
      }

      .video-status {
        height: 8px;
        width: 8px;
        border-radius: 50%;
        background-color: #4b5563;
      }

      .video-status.active {
        background-color: #ef4444;
        animation: pulse 2s infinite;
      }

      .video-display {
        height: 180px;
        position: relative;
        background: linear-gradient(45deg, #041c2c, #000);
        overflow: hidden;
        transition: height 0.3s ease-out;
      }

      /* Collapsed state for the video display */
      .video-display.collapsed {
        height: 40px;
      }

      #vhss-aiplayer-inner * {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 10;
        -webkit-overflow-scrolling: touch;
      }

      /* SitePal main container styles */
      .vhss_bgVideo {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        background-size: cover !important;
        background-position: center center !important;
        background-repeat: no-repeat !important;
        z-index: 10;
        top: 0 !important;
      }

      /* SitePal character container */
      .vhss_character {
        position: absolute !important;
        bottom: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 11;
      }

      /* SitePal canvas */
      .vhss_character canvas {
        position: absolute !important;
        bottom: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 12;
      }

      /* SitePal button holder */
      .vhsshtml5_button_holder {
        position: absolute !important;
        bottom: 50.5px !important;
        left: 0 !important;
        width: 100% !important;
        z-index: 13;
      }

      /* SitePal loading logo */
      .waiting_logo {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 14;
      }

      /* SitePal transcript */
      .vhsshtml5_transcript {
        position: absolute !important;
        bottom: 0 !important;
        left: 0 !important;
        width: 100% !important;
        z-index: 15;
      }

      #sitepal-container {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 10;
        display: none;
        -webkit-overflow-scrolling: touch;
      }

      #sitepal-container.active {
        display: block;
      }

      /* Ensure video stays behind sitepal when active */
      #video-feed {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      #video-feed video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* Add transition and initial z-index */
        transition: opacity 0.5s ease-out;
        z-index: 15; /* Ensure it's above sitepal-container (z-index 10) during effect */
        display: none; /* Hide initially */
      }

      .video-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: repeating-linear-gradient(
          transparent,
          transparent 1px,
          rgba(6, 182, 212, 0.05) 1px,
          rgba(6, 182, 212, 0.05) 2px
        );
        background-size: 100% 2px;
        pointer-events: none;
        z-index: 10;
        display: none;
        -webkit-overflow-scrolling: touch;
      }

      /* 3D video overlay */
      .threedy-mode .video-overlay {
        background-image: repeating-linear-gradient(
          transparent,
          transparent 1px,
          rgba(255, 0, 64, 0.05) 1px,
          rgba(0, 180, 255, 0.05) 2px
        );
        background-size: 100% 2px;
        box-shadow: inset -2px 0 10px rgba(255, 0, 64, 0.1),
          inset 2px 0 10px rgba(0, 180, 255, 0.1);
      }

      /* 80s video overlay */
      .eighties-active .video-overlay {
        background-image: repeating-linear-gradient(
          transparent,
          transparent 1px,
          rgba(217, 70, 239, 0.05) 1px,
          rgba(34, 211, 238, 0.05) 2px
        );
        background-size: 100% 2px;
        box-shadow: inset 0 0 20px rgba(217, 70, 239, 0.1);
        opacity: 0.8;
      }

      .video-gradient {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: linear-gradient(
          to bottom,
          transparent,
          rgba(0, 0, 0, 0.5)
        );
        pointer-events: none;
      }

      .video-feed {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #4b5563;
      }

      .video-feed.offline::before,
      .video-feed.offline::after {
        content: "";
        position: absolute;
        background-color: #1f2937;
      }

      .video-feed.offline::before {
        width: 100%;
        height: 1px;
        top: 50%;
      }

      .video-feed.offline::after {
        height: 100%;
        width: 1px;
        left: 50%;
      }

      .self-view {
        position: absolute;
        bottom: 8px;
        right: 8px;
        width: 60px;
        height: 40px;
        background-color: #111827;
        border: 1px solid #0e7490;
        border-radius: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        z-index: 20; /* Ensure it stays above SitePal elements */
      }

      .self-view img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .self-view .emoji-placeholder {
        font-size: 1.75rem;
        color: #67e8f9;
        text-shadow: 0 0 5px #06b6d4;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        line-height: 1;
      }

      .live-indicator {
        position: absolute;
        bottom: 8px;
        left: 8px;
        font-size: 0.75rem;
        color: #22d3ee;
        animation: pulse 2s infinite;
      }

      .video-controls {
        background-color: #111827;
        padding: 4px;
        display: flex;
        justify-content: space-between;
        position: relative;
        z-index: 100;
      }

      .call-button {
        font-size: 0.75rem;
        font-family: monospace;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1f2937;
        color: #22d3ee;
        border: 1px solid #134e4a;
        box-shadow: 0 0 5px rgba(6, 182, 212, 0.3);
        position: relative;
        z-index: 101;
      }

      .call-button.disconnect {
        color: #f87171;
        border-color: #7f1d1d;
        box-shadow: 0 0 5px rgba(220, 38, 38, 0.3);
      }

      .station-select {
        background-color: #1f2937;
        color: #22d3ee;
        font-size: 0.75rem;
        font-family: monospace;
        padding: 0 4px;
        border: 1px solid #134e4a;
        border-radius: 4px;
        box-shadow: 0 0 3px rgba(6, 182, 212, 0.2);
        position: relative;
        z-index: 101;
      }

      .button-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
      }

      .control-button {
        background-color: #1f2937;
        border-left: 2px solid #ff0040;
        border-right: 2px solid #00b4ff;
        border-top: 1px solid transparent; /* Add transparent top/bottom for consistency */
        border-bottom: 1px solid transparent;
        border-radius: 4px;
        padding: 12px;
        color: #67e8f9;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center; /* Vertically center content */
        min-height: 62px; /* Ensure consistent minimum height */
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: -2px 0 5px rgba(255, 0, 64, 0.3),
          2px 0 5px rgba(0, 180, 255, 0.3), 0 0 5px rgba(6, 182, 212, 0.2),
          inset 0 0 10px rgba(6, 182, 212, 0.05);
      }

      .control-button:hover {
        background-color: #374151;
        border-left: 2px solid #ff4080;
        border-right: 2px solid #40b4ff;
        box-shadow: -3px 0 10px rgba(255, 0, 64, 0.5),
          3px 0 10px rgba(0, 180, 255, 0.5);
      }

      .button-prefix {
        font-size: 0.75rem;
        line-height: 1.3;
        margin-bottom: 4px;
        opacity: 0.7;
      }

      .button-label {
        font-weight: bold;
        letter-spacing: 0.1em;
        font-size: 0.875rem;
        line-height: 1.3;
      }

      .button-indicator {
        width: 32px;
        height: 4px;
        margin-top: 4px;
        background-color: #0e7490;
        border-radius: 9999px;
      }

      .toggle-section {
        margin-bottom: 16px;
        background-color: #111827;
        padding: 12px;
        border-radius: 4px;
        border: 1px solid #134e4a;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
      }

      .toggle-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .toggle-row.music-row {
        flex-wrap: wrap;
      }

      .toggle-row .label-switch-container {
        display: flex;
        width: 100%;
        justify-content: space-between;
        align-items: center;
      }

      .toggle-row:last-child {
        margin-bottom: 0;
      }

      .toggle-label {
        font-size: 0.875rem;
        line-height: 1.4;
      }

      .toggle-switch {
        width: 48px;
        height: 24px;
        background-color: #1f2937;
        border-radius: 9999px;
        position: relative;
        padding: 2px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .toggle-switch.active {
        background-color: #134e4a;
        box-shadow: 0 0 5px rgba(6, 182, 212, 0.5);
      }

      .toggle-switch.eighties.active {
        background-color: #4c1d95;
        box-shadow: 0 0 5px rgba(147, 51, 234, 0.5);
      }

      .toggle-switch.music.active {
        background-color: #ca8a04;
        box-shadow: 0 0 5px rgba(234, 179, 8, 0.5);
      }

      .toggle-switch.music:hover {
        box-shadow: 0 0 8px rgba(234, 179, 8, 0.7);
      }

      .toggle-handle {
        width: 18px;
        height: 18px;
        background-color: #e5e7eb;
        border-radius: 50%;
        position: absolute;
        top: 3px;
        left: 3px;
        transition: transform 0.3s;
      }

      .toggle-switch.active .toggle-handle {
        transform: translateX(24px);
      }

      .leaderboard-header {
        width: 100%;
        background-color: #1f2937;
        border-radius: 4px;
        border: 1px solid #134e4a;
        padding: 4px;
        font-family: monospace;
        color: #22d3ee;
        font-size: 0.75rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
        cursor: pointer;
        box-shadow: 0 0 5px rgba(6, 182, 212, 0.2);
      }

      .leaderboard-content {
        background-color: #111827;
        border-radius: 4px;
        border: 1px solid #134e4a;
        padding: 8px;
        font-family: monospace;
        color: #22d3ee;
        font-size: 0.875rem;
        margin-bottom: 12px;
        box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.7);
        background-image: linear-gradient(to bottom, #0c1721, #0a0f16);
      }

      .leaderboard-header-row {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        margin-bottom: 4px;
        padding-bottom: 4px;
        border-bottom: 1px solid #1f2937;
      }

      .leaderboard-scrollable {
        height: 128px;
        overflow-y: auto;
        background-image: repeating-linear-gradient(
          transparent,
          transparent 1px,
          rgba(6, 182, 212, 0.03) 1px,
          rgba(6, 182, 212, 0.03) 2px
        );
        background-size: 100% 2px;
      }

      .leaderboard-entry {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
      }

      .leaderboard-entry.top {
        color: #67e8f9;
        font-weight: bold;
        text-shadow: 0 0 5px #06b6d4;
      }

      .leaderboard-footer {
        margin-top: 8px;
        font-size: 0.75rem;
        text-align: center;
        color: #22d3ee;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .pulse-dot {
        height: 4px;
        width: 4px;
        border-radius: 50%;
        background-color: #22d3ee;
        margin-right: 4px;
        animation: pulse 2s infinite;
      }

      .status-bar {
        margin-top: 16px;
        display: flex;
        justify-content: space-between;
        margin-top: auto; /* Push status bar to the bottom */
      }

      .status-indicator {
        display: flex;
        align-items: center;
      }

      .status-light {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 8px;
        background-color: #ef4444;
      }

      .status-light.active {
        background-color: #22d3ee;
        animation: pulse 2s infinite;
        box-shadow: 0 0 5px #06b6d4, 0 0 5px 2px rgba(255, 255, 255, 0.7),
          -2px 0 8px #ff0040, 2px 0 8px #00b4ff;
      }

      .status-label {
        font-size: 0.75rem;
      }

      .version-info {
        font-size: 0.75rem;
        color: #4b5563;
      }

      .spacer {
        flex-grow: 1;
      }

      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .leaderboard-scrollable::-webkit-scrollbar {
        display: none;
      }

      /* Hide scrollbar for IE, Edge and Firefox */
      .leaderboard-scrollable {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }

      .control-button[data-action="launch"] {
        position: relative;
      }

      .control-button[data-action="launch"]:after {
        content: "";
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        border-radius: 6px;
        background: transparent;
        transition: all 0.3s;
      }

      .control-button[data-action="launch"].active {
        background-color: #450a0a;
        border-color: #dc2626;
      }

      .control-button[data-action="launch"].active:after {
        background: linear-gradient(45deg, #dc2626, #450a0a);
        filter: blur(8px);
        opacity: 0.6;
        z-index: -1;
      }

      .control-button[data-action="launch"] .button-indicator {
        background-color: #dc2626;
        transition: all 0.3s;
      }

      .control-button[data-action="launch"].active .button-indicator {
        animation: redPulse 2s infinite;
      }

      .toggle-switch.emergency.active {
        background-color: #991b1b;
        box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
      }

      .toggle-switch.emergency.active .toggle-handle {
        background-color: #fecaca;
      }

      #vhss-aiplayer-aiformlogs {
        display: none !important;
        opacity: 0 !important;
      }

      /* 80s mode styles */
      .mission-control.eighties-active {
        /* background-image: linear-gradient(to bottom, #0b132b, #2a1786); */
        border-left: 1px solid #d946ef;
        box-shadow: 0 0 12px rgba(217, 70, 239, 0.3),
          inset 0 0 8px rgba(217, 70, 239, 0.1);
      }

      .eighties-active .panel-title {
        height: 22px;
        line-height: 1.5;
        font-size: 0.8rem;
        color: #d946ef;
        text-shadow: 0 0 3px #d946ef, 0 0 6px #d946ef;
        font-family: "Press Start 2P", cursive;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
      }

      .eighties-active .panel-subtitle {
        height: 18px;
        line-height: 1.4;
        font-size: 0.6rem;
        color: #22d3ee;
        font-family: "Press Start 2P", cursive;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
      }

      .eighties-active .toggle-label,
      .eighties-active .button-label,
      .eighties-active .button-prefix,
      .eighties-active .status-label {
        font-family: "Press Start 2P", cursive;
        font-size: 0.6rem;
        line-height: 1.5;
      }

      .eighties-active .control-button {
        border: 1px solid #d946ef !important; /* Consistent 1px border */
        padding: 12px !important; /* Use same padding as base */
        min-height: 62px !important; /* Ensure override for consistency */
        box-shadow: 0 0 3px rgba(217, 70, 239, 0.3) !important;
        background-image: linear-gradient(
          to bottom,
          #0f172a,
          #2a1786
        ) !important;
        border-left: 1px solid #d946ef !important;
        border-right: 1px solid #d946ef !important;
        transition: all 0.3s;
      }

      .eighties-active .control-button:hover {
        /* background-image: linear-gradient(to bottom, #2a1786, #0f172a); */
        transform: translateY(-2px);
        box-shadow: 0 0 6px rgba(217, 70, 239, 0.5);
      }

      .eighties-active .button-indicator {
        background-color: #d946ef;
        box-shadow: 0 0 3px #d946ef;
      }

      .eighties-active .toggle-section,
      .eighties-active .leaderboard-header,
      .eighties-active .leaderboard-content {
        border-color: #d946ef;
      }

      .eighties-active .status-light.active {
        background-color: #22d3ee;
        box-shadow: 0 0 6px #22d3ee;
        animation: flicker 2s infinite;
      }

      /* VHS glitch effect */
      /* @keyframes glitch {
                                0% {
                                  transform: translate(0);
                                }
                                20% {
                                  transform: translate(-2px, 2px);
                                }
                                40% {
                                  transform: translate(-2px, -2px);
                                }
                                60% {
                                  transform: translate(2px, 2px);
                                }
                                80% {
                                  transform: translate(2px, -2px);
                                }
                                100% {
                                  transform: translate(0);
                                }
                              } */

      @keyframes flicker {
        0% {
          opacity: 1;
        }
        25% {
          opacity: 0.8;
        }
        30% {
          opacity: 1;
        }
        35% {
          opacity: 0.6;
        }
        40% {
          opacity: 1;
        }
        50% {
          opacity: 0.9;
        }
        75% {
          opacity: 1;
        }
        80% {
          opacity: 0.7;
        }
        100% {
          opacity: 1;
        }
      }

      .eighties-active .panel-title {
        animation: glitch 5s infinite;
      }

      /* Color shifting for VHS effect */
      .color-shift {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        mix-blend-mode: screen;
        pointer-events: none;
        opacity: 0;
        z-index: 998;
        transition: opacity 0.3s ease;
      }

            <div
              id="sitepal-container"
              style="
                display: none;

              "
            >
              <script
                type="text/javascript"
                src="//vhss-d.oddcast.com/ai_embed_functions_v1.php"
              ></script>
              <script type="text/javascript">
                // Replace verbose console logging with empty operations in production
                if (location.hostname !== "localhost") {
                  console.log = function () {};
                  console.debug = function () {};
                }

                // Global helper for SitePal API access
                window.sitePalHelper = {
                  initialized: false,

                  initApi: function () {
                    if (
                      typeof AI_vhost_stop === "function" &&
                      typeof AI_vhost_api === "function" &&
                      typeof AI_vhost_destroy === "function"
                    ) {
                      console.log("SitePal API functions accessed globally");
                      this.initialized = true;
                      return true;
                    }
                    return false;
                  },

                  startListening: function () {
                    if (this.initApi() || this.initialized) {
                      try {
                        console.log("Starting SitePal listening via helper");

                        // First try to find and click the mic button directly
                        const micButton = document.querySelector(
                          ".vhss-aiplayer-mic-p3"
                        );
                        if (micButton) {
                          console.log("Found mic button directly, clicking it");
                          micButton.click();
                          return true;
                        }

                        // If button not found, try using the API
                        if (typeof saySilent === "function") {
                          saySilent(0);
                        }
                        setTimeout(() => {
                          AI_vhost_api("startListening");
                        }, 300);
                        return true;
                      } catch (e) {
                        console.error("Error starting SitePal listening:", e);
                      }
                    }
                    return false;
                  },

                  stopListening: function () {
                    if (this.initApi() || this.initialized) {
                      try {
                        console.log("Stopping SitePal listening via helper");
                        AI_vhost_api("stopListening");
                        return true;
                      } catch (e) {
                        console.error("Error stopping SitePal listening:", e);
                      }
                    }
                    return false;
                  },
                };

                function initSitePal() {
                  console.log("Starting SitePal initialization...");

                  // Set a visible loading state
                  const sitepalContainer =
                    document.getElementById("sitepal-container");
                  if (sitepalContainer) {
                    sitepalContainer.innerHTML =
                      '<div id="vhss_aiPlayer" style="text-align: center; color: #67e8f9;">Loading AI Agent...</div>';
                  }

                  // Special iOS initialization path
                  if (isIOS || browserIsSafari) {
                    console.log("Using iOS-specific initialization path");
                    initSitePalOnIOS();
                    return;
                  }

                  // Clear any existing initialization
                  cleanupSitePal();

                  // Load the embed script if not present
                  if (typeof AI_vhost_embed !== "function") {
                    console.log("Loading SitePal embed script...");
                    const scriptEl = document.createElement("script");
                    scriptEl.src =
                      "//vhss-d.oddcast.com/vhost_embed_functions_v4.php?acc=9157686&js=1";
                    scriptEl.type = "text/javascript";
                    document.head.appendChild(scriptEl);

                    scriptEl.onload = function () {
                      console.log("SitePal embed script loaded");
                      setTimeout(performEmbed, 500);
                    };
                  } else {
                    console.log("SitePal embed script already loaded");
                    performEmbed();
                  }

                  function performEmbed() {
                    try {
                      console.log("Performing SitePal embed...");

                      // Set up scene loaded callback before embed
                      window.vh_sceneLoaded = function (sceneIndex, portal) {
                        console.log(
                          `vh_sceneLoaded callback fired for sceneIndex: ${sceneIndex}, portal: ${portal}`
                        );
                        window.sitepalSceneReady = true; // Set flag

                        // Prevent double invocation
                        if (window.sceneAlreadyLoaded) {
                          console.log(
                            "Scene load callback called again - ignoring subsequent calls"
                          );
                          return;
                        }
                        window.sceneAlreadyLoaded = true;

                        // Fade out the transmission video
                        const deadAir = document.getElementById("deadAir");
                        if (deadAir) {
                          console.log(
                            "Scene loaded, fading out transmission video..."
                          );
                          deadAir.style.opacity = 0;
                          setTimeout(() => {
                            console.log(
                              "Pausing transmission video after fade."
                            );
                            deadAir.pause();
                          }, 500); // Matches CSS transition duration
                        }

                        // Prime audio playback using silent speech
                        try {
                          console.log(
                            "Priming browser with silent playback..."
                          );
                          window.saySilent(0);
                        } catch (e) {
                          console.warn("saySilent(0) failed:", e);
                        }

                        // Get the call button
                        const callButton =
                          document.getElementById("call-button");
                        if (!callButton) return;

                        // Check if we need the three-state approach or can auto-transition
                        if (window.needsUnmuteFlow) {
                          // Three-state approach for iOS, Safari, mobile devices
                          if (callButton.textContent !== "DISCONNECT") {
                            callButton.textContent = "UN-MUTE";
                            callButton.classList.add("unmute");
                            callButton.classList.remove("disconnect");

                            // Prevent automatic triggering by disabling/re-enabling
                            callButton.disabled = true;
                            setTimeout(() => {
                              callButton.disabled = false;
                            }, 500);

                            console.log(
                              "SitePal scene loaded, setting button to UN-MUTE state (three-state flow)"
                            );
                          }
                        } else {
                          // Auto-transition approach for desktop browsers
                          console.log(
                            "Auto-transition flow - activating immediately"
                          );

                          // Short delay to ensure everything is ready
                          setTimeout(() => {
                            // Prime audio again
                            try {
                              if (typeof window.saySilent === "function") {
                                window.saySilent(0);
                              }
                            } catch (e) {
                              console.warn(
                                "Auto-activation saySilent failed:",
                                e
                              );
                            }

                            // Update UI to DISCONNECT state first
                            callButton.textContent = "DISCONNECT";
                            callButton.classList.remove("unmute");
                            callButton.classList.add("disconnect");

                            // DIRECTLY call the greeting functions, don't rely solely on activateMicrophone
                            // Each method in its own try/catch for maximum reliability
                            setTimeout(() => {
                              console.log(
                                "DIRECT GREETING ATTEMPT FOR DESKTOP"
                              );

                              // Try the most reliable method first - direct window.sayText() call
                              try {
                                if (typeof window.sayText === "function") {
                                  console.log(
                                    "Desktop direct greeting: calling window.sayText()"
                                  );
                                  window.sayText(
                                    "Greetings, how can I help you today?",
                                    8,
                                    1,
                                    6
                                  );
                                }
                              } catch (e1) {
                                console.error(
                                  "Desktop direct greeting method 1 failed:",
                                  e1
                                );
                              }

                              // Secondary: try local sayText
                              try {
                                if (typeof sayText === "function") {
                                  console.log(
                                    "Desktop direct greeting: calling local sayText()"
                                  );
                                  sayText(
                                    "Greetings, how can I help you today?",
                                    8,
                                    1,
                                    6
                                  );
                                }
                              } catch (e2) {
                                console.error(
                                  "Desktop direct greeting method 2 failed:",
                                  e2
                                );
                              }

                              // Also call activateMicrophone as a backup
                              try {
                                activateMicrophone();
                              } catch (e3) {
                                console.error(
                                  "Desktop activateMicrophone call failed:",
                                  e3
                                );
                              }

                              // Send state change message to parent
                              window.parent.postMessage(
                                {
                                  type: "SITEPAL_STATE_CHANGE",
                                  isListening: true,
                                },
                                "*"
                              );
                            }, 300); // Short delay before direct greeting attempts
                          }, 500);
                        }

                        // Notify parent frame that SitePal is ready
                        window.parent.postMessage(
                          { type: "SITEPAL_READY" },
                          "*"
                        );
                      };

                      // Set up listening status callback (remains the same)
                      window.vh_listeningStatusUpdate = function (isListening) {
                        console.log(
                          "SitePal listening status update:",
                          isListening
                        );
                        window.parent.postMessage(
                          {
                            type: "SITEPAL_STATE_CHANGE",
                            isListening: isListening,
                          },
                          "*"
                        );
                      };

                      // Perform the embed
                      AI_vhost_embed(280, 180, 9157686, 244, 1, 1);

                      // Set up initialization check
                      let checkCount = 0;
                      const maxChecks = 20;

                      const checkInterval = setInterval(() => {
                        checkCount++;
                        console.log(
                          `Checking SitePal initialization (${checkCount}/${maxChecks})...`
                        );

                        if (window.sitepalInitialized) {
                          console.log("SitePal initialization confirmed");
                          clearInterval(checkInterval);
                          activateMicrophone();
                          return;
                        }

                        // Try to find the mic button
                        const micButton = document.querySelector(
                          ".vhss-aiplayer-mic-p3"
                        );
                        if (micButton) {
                          console.log("Found SitePal mic button!");
                          window.sitepalInitialized = true;
                          clearInterval(checkInterval);
                          window.parent.postMessage(
                            { type: "SITEPAL_READY" },
                            "*"
                          );
                          activateMicrophone();
                          return;
                        }

                        // Check iframes
                        const iframes = document.querySelectorAll("iframe");
                        for (let iframe of iframes) {
                          try {
                            const iframeDoc =
                              iframe.contentDocument ||
                              iframe.contentWindow.document;
                            const iframeMicButton = iframeDoc.querySelector(
                              ".vhss-aiplayer-mic-p3"
                            );
                            if (iframeMicButton) {
                              console.log(
                                "Found SitePal mic button in iframe!"
                              );
                              window.sitepalInitialized = true;
                              clearInterval(checkInterval);
                              window.parent.postMessage(
                                { type: "SITEPAL_READY" },
                                "*"
                              );
                              activateMicrophone();
                              return;
                            }
                          } catch (e) {
                            // Ignore iframe access errors
                          }
                        }

                        if (checkCount >= maxChecks) {
                          console.warn(
                            "SitePal initialization check timed out"
                          );
                          clearInterval(checkInterval);
                          // Try one last time
                          activateMicrophone();
                        }
                      }, 1000);
                    } catch (e) {
                      console.error("Error during SitePal embed:", e);
                    }
                  }
                }

                // Function to handle microphone activation
                function activateMicrophone() {
                  console.log("Attempting to activate microphone...");

                  // Check if microphone might already be active
                  let micAlreadyActive = false;

                  // First check if SitePal API can tell us if listening is active
                  try {
                    if (typeof AI_vhost_api === "function") {
                      // Some versions of the API support checking if we're already listening
                      if (typeof AI_get_listening_status === "function") {
                        micAlreadyActive = AI_get_listening_status();
                        console.log(
                          "Checked listening status via API:",
                          micAlreadyActive
                        );
                      }
                    }
                  } catch (e) {
                    console.warn("Error checking listening status:", e);
                  }

                  // If we're already listening, just update UI and trigger greeting
                  if (micAlreadyActive) {
                    console.log(
                      "Microphone appears to be already active, skipping activation"
                    );
                    updateUIForRecording();
                    triggerGreeting();
                    return;
                  }

                  // Try multiple approaches to activate the microphone
                  let success = false;

                  // 1. Try direct API call first
                  try {
                    if (typeof AI_vhost_api === "function") {
                      console.log("Using direct API call to start listening");
                      try {
                        AI_vhost_api("stopListening"); // First stop to avoid errors
                        setTimeout(() => {
                          try {
                            AI_vhost_api("startListening");
                          } catch (startErr) {

    <script>
      // DOM elements

      // Helper function to load scripts
      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement("script");
          script.src = src;
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
      }

      // State
      let isCallActive = false;
      let isEightiesMode = false;
      let isLeaderboardExpanded = false; // Add leaderboard state variable

      // Music toggle starts off by default
      musicToggle.classList.remove("active");

      function playClickSound() {
        try {
          const audioContext = new (window.AudioContext ||
            window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          oscillator.type = "sine";
          oscillator.frequency.setValueAtTime(880, audioContext.currentTime); // A5
          gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(
            0.01,
            audioContext.currentTime + 0.1
          );
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          oscillator.start();
          oscillator.stop(audioContext.currentTime + 0.1);
        } catch (e) {
          console.log("Audio context error:", e);
        }
      }

      // Add iOS detection
      const isIOS =
        /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      const browserIsSafari = /^((?!chrome|android).)*safari/i.test(
        navigator.userAgent
      );

      // Log device detection
      console.log("Device detection:", {
        isIOS: isIOS,
        browserIsSafari: browserIsSafari,
        userAgent: navigator.userAgent,
      });

      // Handle initial video playback for iOS
      document.addEventListener("DOMContentLoaded", () => {
        const deadAir = document.getElementById("deadAir");
        const offlineDisplay = document.getElementById("offline-display");
        const callButton = document.getElementById("call-button"); // Get call button

        offlineDisplay.style.display = "flex"; // Show offline state
        deadAir.style.display = "none"; // Hide video initially
        deadAir.pause(); // Ensure video is paused initially

        // Add initial pulse to CONNECT button
        if (callButton) {
          // Check if button exists
          callButton.classList.add("initial-pulse");
        }

        // Special handling for iOS
        if (isIOS || browserIsSafari) {
          console.log("iOS/Safari detected - applying special handling");

          // Add a click handler to the whole document to initialize audio on iOS
          document.addEventListener(
            "click",
            function iosAudioInit() {
              console.log("iOS document click - initializing audio context");
              deadAir
                .play()
                .catch((e) => console.log("iOS initial play rejected:", e));

              // Try to prime the audio early
              try {
                if (typeof saySilent === "function") {
                  saySilent(0);
                }
              } catch (e) {
                console.log("Early audio priming failed:", e);
              }

              // Remove the listener after first click
              document.removeEventListener("click", iosAudioInit);
            },
            { once: true }
          );

          // For iOS we need to specially handle the call button click
          callButton.addEventListener(
            "click",
            function (e) {
              console.log("Call button clicked on iOS");

              // If we're connecting, make sure we always show the UN-MUTE button
              if (!isCallActive) {
                window.forceUnmuteOnIOS = true;

                // Create a temporary audio context to help initialize audio system
                try {
                  const tempContext = new (window.AudioContext ||
                    window.webkitAudioContext)();
                  tempContext.resume().then(() => {
                    console.log("Temporary audio context resumed");
                  });

                  // Create and play a brief silent sound
                  const oscillator = tempContext.createOscillator();
                  const gainNode = tempContext.createGain();
                  gainNode.gain.value = 0.0001; // Nearly silent
                  oscillator.connect(gainNode);
                  gainNode.connect(tempContext.destination);
                  oscillator.start(0);
                  oscillator.stop(tempContext.currentTime + 0.001);
                } catch (e) {
                  console.warn("Temporary audio context creation failed:", e);
                }
              }

              // Try to prime audio regardless of browser
              try {
                if (typeof window.saySilent === "function") {
                  window.saySilent(0);
                  // Add a small delay before any subsequent audio operations
                  setTimeout(() => {
                    try {
                      // Try to start listening after priming
                      if (typeof AI_vhost_api === "function") {
                        AI_vhost_api("startListening");
                      }
                    } catch (err) {
                      console.log(
                        "Post-prime listening activation failed:",
                        err
                      );
                    }
                  }, 100);
                }
              } catch (err) {
                console.log("Audio priming on CONNECT click failed:", err);
              }
            },
            { capture: true }
          );
        }

        // Removed initial play attempt here, now paused by default
        // deadAir
        //   .play()
        //   .catch((e) => console.log("Initial auto-play prevented:", e));
      });

      // --- Audio Priming for Mobile ---
      let hasPrimed = false;
      function primeAudio() {
        if (!hasPrimed) {
          try {
            // Use SitePal's silent function if available, otherwise ignore
            if (typeof window.saySilent === "function") {
              window.saySilent(0); // Play silent audio
              console.log("SitePal saySilent(0) used for audio priming.");
            } else {
              console.log("saySilent not available, skipping audio priming.");
            }
            hasPrimed = true;
          } catch (e) {
            console.error("Error during audio priming:", e);
          }
        }
      }
      // Attach priming to first user interaction
      document.addEventListener("click", primeAudio, { once: true });
      document.addEventListener("touchstart", primeAudio, { once: true });
      // --- End Audio Priming ---

      // Add a function to detect if the three-state approach is needed
      function needsUnmuteState() {
        // iOS and Safari always need the three-state approach
        if (isIOS || browserIsSafari) {
          console.log("iOS/Safari detected - using three-state approach");
          return true;
        }

        // Mobile devices generally need the user interaction
        if (
          /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
            navigator.userAgent
          )
        ) {
          console.log("Mobile browser detected - using three-state approach");
          return true;
        }

        // Check if URL parameter explicitly requests it
        const urlParams = new URLSearchParams(window.location.search);
        if (
          urlParams.get("unmute") === "true" ||
          urlParams.get("three-state") === "true"
        ) {
          console.log("Three-state approach explicitly requested via URL");
          return true;
        }

        // For Chrome and other browsers on desktop, auto-transition is generally fine
        console.log(
          "Desktop non-Safari browser detected - will use auto-transition"
        );
        return false;
      }

      // Set the global flag early
      window.needsUnmuteFlow = needsUnmuteState();

      // Toggle call - Refactored Logic with special iOS handling
      callButton.addEventListener("click", () => {
        console.log(
          "Call button clicked, current text:",
          callButton.textContent
        );

        if (callButton.textContent === "CONNECT") {
          // ---- Connect Flow ----
          console.log("Connecting call and initializing SitePal...");
          isCallActive = true;
          window.sceneAlreadyLoaded = false; // Reset this flag when connecting
          window.allowButtonTransition = true; // Allow transitions on new connection
          window.greetingPlayed = false; // Reset greeting flag

          // Reset flag in case needsUnmuteState changes (e.g., browser change)
          window.needsUnmuteFlow = needsUnmuteState();

          // --- Transmission Effect Start ---
          const deadAir = document.getElementById("deadAir");
          const sitepalContainer = document.getElementById("sitepal-container");
          const offlineDisplay = document.getElementById("offline-display"); // Get offline display
          const transmissionEffectDuration = 3500; // ms - Shortened duration
          const fadeOutDuration = 500; // ms (should match CSS transition)

          // Hide offline display
          offlineDisplay.style.display = "none";

          // Make video visible and opaque, then play
          deadAir.style.display = "block";
          deadAir.style.opacity = 1;
          deadAir.muted = true;
          deadAir.loop = true;
          deadAir
            .play()
            .catch((e) => console.error("Transmission video play failed:", e));

          // Show SitePal container behind the video
          sitepalContainer.style.display = "block";
          // --- End Transmission Effect Start ---

          // Activate call status indicator
          callStatus.classList.add("active");

          // Clean up any existing instance
          if (sitepalContainer.dataset.initialized === "true") {
            console.log("Cleaning up previous SitePal instance...");
            cleanupSitePal();
          }

          // Initialize SitePal
          initSitePal();
          sitepalContainer.dataset.initialized = "true";

          // Update UI
          selfView.style.display = "block";
          updateSelfView();
          liveIndicator.style.display = "block";
          stationSelect.disabled = true;

          // Set to UN-MUTE state initially instead of DISCONNECT
          callButton.textContent = "UN-MUTE";
          callButton.classList.add("unmute"); // Add a new class for styling
          callButton.classList.remove("disconnect");
          console.log("Call connected, button set to UN-MUTE");

          // Remove initial pulse from CONNECT button
          callButton.classList.remove("initial-pulse");

          // Special handling for iOS - maintain but don't activate mic yet
          if (isIOS || browserIsSafari) {
            console.log(
              "iOS/Safari detected - deferring mic activation until UN-MUTE"
            );

            // Try to prime audio system
            try {
              const tempContext = new (window.AudioContext ||
                window.webkitAudioContext)();
              tempContext.resume().then(() => {
                console.log("Temporary audio context resumed");
              });

              // Create and play a brief silent sound
              const oscillator = tempContext.createOscillator();
              const gainNode = tempContext.createGain();
              gainNode.gain.value = 0.0001; // Nearly silent
              oscillator.connect(gainNode);
              gainNode.connect(tempContext.destination);
              oscillator.start(0);
              oscillator.stop(tempContext.currentTime + 0.001);
            } catch (e) {
              console.warn("Temporary audio context creation failed:", e);
            }
          }

          // Expand video display when connecting
          const videoDisplay = document.querySelector(".video-display");
          if (videoDisplay) {
            videoDisplay.classList.add("active");
          }
        } else if (callButton.textContent === "UN-MUTE") {
          // ---- UN-MUTE Flow (new state) ----
          console.log("UN-MUTE clicked, activating microphone...");

          // Prevent multiple clicks
          callButton.disabled = true;

          // For iOS, we need to be more careful with audio handling
          const isIOSOrSafari = isIOS || browserIsSafari;

          // Prime audio with SitePal silent function
          try {
            // On iOS, use window.saySilent to ensure it works
            if (typeof window.saySilent === "function") {
              console.log(
                "Calling window.saySilent(0) to prime audio system..."
              );
              window.saySilent(0);
            } else if (typeof saySilent === "function") {
              // Fallback to local saySilent
              console.log(
                "Calling local saySilent(0) to prime audio system..."
              );
              saySilent(0);
            }
          } catch (e) {
            console.warn("saySilent call failed:", e);
          }

          // For iOS, we need to handle possible errors with the recognition system
          if (isIOSOrSafari) {
            console.log(
              "iOS/Safari detected - using specialized activation path"
            );

            // First try to stop any existing recognition to avoid errors
            try {
              if (typeof AI_vhost_api === "function") {
                console.log("Trying to stop any existing recognition first");
                AI_vhost_api("stopListening");
              }
            } catch (e) {
              console.log("Error stopping recognition:", e);
            }

            // Short delay before activation to allow stop to complete
            setTimeout(() => {
              activateMicrophone();

              // Enable button and update to DISCONNECT state
              callButton.disabled = false;
              callButton.textContent = "DISCONNECT";
              callButton.classList.remove("unmute");
              callButton.classList.add("disconnect");
              console.log(
                "Microphone activation attempted, button set to DISCONNECT"
              );

              // Send state change message to parent
              window.parent.postMessage(
                { type: "SITEPAL_STATE_CHANGE", isListening: true },
                "*"
              );
            }, 500); // Longer delay for iOS
          } else {
            // Standard path for non-iOS browsers

        // Reset all UI elements
        callButton.textContent = "CONNECT";
        callButton.classList.remove("disconnect", "unmute");
        callStatus.classList.remove("active");
        stationSelect.disabled = false;
        selfView.style.display = "none";
        liveIndicator.style.display = "none";

        // Show offline display
        offlineDisplay.style.display = "flex";

        // Hide and stop video, hide SitePal
        deadAir.style.display = "none";
        deadAir.pause();
        sitepalContainer.style.display = "none";

        // Clean up SitePal instance
        cleanupSitePal();

        // Reset the initialization state
        sitepalContainer.dataset.initialized = "false";

        // Notify parent
        window.parent.postMessage(
          { type: "SITEPAL_STATE_CHANGE", isListening: false },
          "*"
        );

        console.log("Call disconnected and cleaned up");
      }

      // Add resize handler to adjust video display state when resizing
      window.addEventListener("resize", function () {
        if (videoDisplay) {
          if (window.innerWidth <= 480 && !isCallActive) {
            videoDisplay.classList.remove("active");
          } else if (window.innerWidth > 480) {
            videoDisplay.classList.add("active");
          }
        }
      });

      // Check for initial message from parent to sync toggle states
      window.addEventListener("message", (event) => {
        // Check if the message is from the parent frame
        if (event.source === window.parent) {
          const data = event.data;

          // Handle state synchronization
          if (data.type === "SYNC_STATE") {
            // Sync 80s mode
            if (data.isEightiesMode !== undefined) {
              isEightiesMode = data.isEightiesMode;
              updateEightiesUI(isEightiesMode);
            }

            // Sync music state
            if (data.isMusicEnabled !== undefined) {
              if (data.isMusicEnabled) {
                musicToggle.classList.add("active");
              } else {
                musicToggle.classList.remove("active");
              }
            }

            // Sync constellation state
            if (data.isConstellationsEnabled !== undefined) {
              if (data.isConstellationsEnabled) {
                constellationToggle.classList.add("active");
              } else {
                constellationToggle.classList.remove("active");
              }
            }
          }

          // Handle music state updates from parent (when music players change state)
          if (data.type === "SET_MUSIC_STATE") {
            // Update music toggle to match the music player state
            if (data.isPlaying !== undefined) {
              if (data.isPlaying) {
                musicToggle.classList.add("active");
              } else {
                musicToggle.classList.remove("active");
              }
              console.log(
                "Music toggle synchronized to player state:",
                data.isPlaying
              );
            }
          }
        }
      });

      // Styling for the music toggle
      document.addEventListener("DOMContentLoaded", function () {
        // Add music toggle style
        const musicToggle = document.getElementById("music-toggle");
        if (musicToggle) {
          // Check if music should be on by default based on screen size
          // On larger screens, music is typically enabled
          if (window.innerWidth > 768) {
            musicToggle.classList.add("active");
            // Notify parent that music should be on
            window.parent.postMessage(
              {
                type: "MUSIC_TOGGLE",
                enabled: true,
              },
              "*"
            );
          }
        }
      });

      // Add window resize handler for toggle layout
      window.addEventListener("resize", () => {
        const toggleRow = document.querySelector(".toggle-row.mobile-inline");
        if (window.innerWidth >= 768 && isEightiesMode) {
          toggleRow.classList.add("fullscreen");
        } else {
          toggleRow.classList.remove("fullscreen");
        }
      });
    </script>
  </body>
</html>
