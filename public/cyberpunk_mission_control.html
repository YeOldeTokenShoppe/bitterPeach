<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyberpunk Mission Control Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <!-- Firebase SDKs (Add these) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-storage-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.7/firebase-firestore-compat.js"></script>

    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: monospace;
        background-color: transparent !important;
        color: #67e8f9;
        display: flex;
        justify-content: center;
        height: 100%;
        overflow: hidden;
        width: 100%;
        position: relative;
      }

      .mission-control {
        width: 100%;
        max-width: 450px;
        height: 100%;
        background-image: linear-gradient(to bottom, #0f172a, #1e293b);
        display: flex;
        flex-direction: column;
        padding: 16px;
        border-left: 1px solid #0e7490;
        border-right: 1px solid #0e7490;
        box-shadow: 0 0 15px rgba(6, 182, 212, 0.3),
          inset 0 0 10px rgba(6, 182, 212, 0.1);
        overflow-y: auto;
        position: relative;
        z-index: 1;
        clip-path: inset(0 0 0 0);
        -webkit-clip-path: inset(0 0 0 0);
        box-sizing: border-box;
      }

      .panel-header {
        text-align: center;
        margin-bottom: 16px;
        padding-bottom: 8px;
        border-bottom: 1px solid #0e7490;
      }

      .panel-title {
        font-size: 1.05rem;
        line-height: 1.2;
        letter-spacing: 0.2em;
        font-weight: bold;
        color: #67e8f9;
        text-shadow: -2px 0 #ff0040, 2px 0 #00b4ff;
        margin: 0;
        position: relative;
        /* animation: threedy-flicker 4s infinite; */
      }

      .panel-subtitle {
        font-size: 0.75rem;
        line-height: 1.4;
        color: white;
        text-shadow: -1px 0 #ff0040, 1px 0 #00b4ff;
        letter-spacing: 0.1em;
        margin-top: 4px;
      }

      .video-call {
        margin-bottom: 16px;
        background-color: #000;
        border: 1px solid #134e4a;
        border-radius: 4px;
        overflow: visible;
        position: relative;
        z-index: 50;
      }

      .video-header {
        background-color: #111827;
        padding: 4px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid #134e4a;
        font-size: 0.75rem;
      }

      .video-status {
        height: 8px;
        width: 8px;
        border-radius: 50%;
        background-color: #4b5563;
      }

      .video-status.active {
        background-color: #ef4444;
        animation: pulse 2s infinite;
      }

      .video-display {
        height: 180px;
        position: relative;
        background: linear-gradient(45deg, #041c2c, #000);
        overflow: hidden;
      }

      #vhss-aiplayer-inner * {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 10;
        -webkit-overflow-scrolling: touch;
      }

      /* SitePal main container styles */
      .vhss_bgVideo {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        background-size: cover !important;
        background-position: center center !important;
        background-repeat: no-repeat !important;
        z-index: 10;
        top: 0 !important;
      }

      /* SitePal character container */
      .vhss_character {
        position: absolute !important;
        bottom: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 11;
      }

      /* SitePal canvas */
      .vhss_character canvas {
        position: absolute !important;
        bottom: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 12;
      }

      /* SitePal button holder */
      .vhsshtml5_button_holder {
        position: absolute !important;
        bottom: 50.5px !important;
        left: 0 !important;
        width: 100% !important;
        z-index: 13;
      }

      /* SitePal loading logo */
      .waiting_logo {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 14;
      }

      /* SitePal transcript */
      .vhsshtml5_transcript {
        position: absolute !important;
        bottom: 0 !important;
        left: 0 !important;
        width: 100% !important;
        z-index: 15;
      }

      #sitepal-container {
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 10;
        display: none;
        -webkit-overflow-scrolling: touch;
      }

      #sitepal-container.active {
        display: block;
      }

      /* Ensure video stays behind sitepal when active */
      #video-feed {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      #video-feed video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* Add transition and initial z-index */
        transition: opacity 0.5s ease-out;
        z-index: 15; /* Ensure it's above sitepal-container (z-index 10) during effect */
        display: none; /* Hide initially */
      }

      .video-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: repeating-linear-gradient(
          transparent,
          transparent 1px,
          rgba(6, 182, 212, 0.05) 1px,
          rgba(6, 182, 212, 0.05) 2px
        );
        background-size: 100% 2px;
        pointer-events: none;
        z-index: 10;
        display: none;
        -webkit-overflow-scrolling: touch;
      }

      /* 3D video overlay */
      .threedy-mode .video-overlay {
        background-image: repeating-linear-gradient(
          transparent,
          transparent 1px,
          rgba(255, 0, 64, 0.05) 1px,
          rgba(0, 180, 255, 0.05) 2px
        );
        background-size: 100% 2px;
        box-shadow: inset -2px 0 10px rgba(255, 0, 64, 0.1),
          inset 2px 0 10px rgba(0, 180, 255, 0.1);
      }

      /* 80s video overlay */
      .eighties-active .video-overlay {
        background-image: repeating-linear-gradient(
          transparent,
          transparent 1px,
          rgba(217, 70, 239, 0.05) 1px,
          rgba(34, 211, 238, 0.05) 2px
        );
        background-size: 100% 2px;
        box-shadow: inset 0 0 20px rgba(217, 70, 239, 0.1);
        opacity: 0.8;
      }

      .video-gradient {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-image: linear-gradient(
          to bottom,
          transparent,
          rgba(0, 0, 0, 0.5)
        );
        pointer-events: none;
      }

      .video-feed {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #4b5563;
      }

      .video-feed.offline::before,
      .video-feed.offline::after {
        content: "";
        position: absolute;
        background-color: #1f2937;
      }

      .video-feed.offline::before {
        width: 100%;
        height: 1px;
        top: 50%;
      }

      .video-feed.offline::after {
        height: 100%;
        width: 1px;
        left: 50%;
      }

      .self-view {
        position: absolute;
        bottom: 8px;
        right: 8px;
        width: 60px;
        height: 40px;
        background-color: #111827;
        border: 1px solid #0e7490;
        border-radius: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        z-index: 20; /* Ensure it stays above SitePal elements */
      }

      .self-view img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .self-view .emoji-placeholder {
        font-size: 1.75rem;
        color: #67e8f9;
        text-shadow: 0 0 5px #06b6d4;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        line-height: 1;
      }

      .live-indicator {
        position: absolute;
        bottom: 8px;
        left: 8px;
        font-size: 0.75rem;
        color: #22d3ee;
        animation: pulse 2s infinite;
      }

      .video-controls {
        background-color: #111827;
        padding: 4px;
        display: flex;
        justify-content: space-between;
        position: relative;
        z-index: 100;
      }

      .call-button {
        font-size: 0.75rem;
        font-family: monospace;
        padding: 4px 8px;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1f2937;
        color: #22d3ee;
        border: 1px solid #134e4a;
        box-shadow: 0 0 5px rgba(6, 182, 212, 0.3);
        position: relative;
        z-index: 101;
      }

      .call-button.disconnect {
        color: #f87171;
        border-color: #7f1d1d;
        box-shadow: 0 0 5px rgba(220, 38, 38, 0.3);
      }

      .station-select {
        background-color: #1f2937;
        color: #22d3ee;
        font-size: 0.75rem;
        font-family: monospace;
        padding: 0 4px;
        border: 1px solid #134e4a;
        border-radius: 4px;
        box-shadow: 0 0 3px rgba(6, 182, 212, 0.2);
        position: relative;
        z-index: 101;
      }

      .button-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-bottom: 16px;
      }

      .control-button {
        background-color: #1f2937;
        border-left: 2px solid #ff0040;
        border-right: 2px solid #00b4ff;
        border-top: 1px solid transparent; /* Add transparent top/bottom for consistency */
        border-bottom: 1px solid transparent;
        border-radius: 4px;
        padding: 12px;
        color: #67e8f9;
        font-family: monospace;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center; /* Vertically center content */
        min-height: 62px; /* Ensure consistent minimum height */
        cursor: pointer;
        transition: all 0.3s;
        box-shadow: -2px 0 5px rgba(255, 0, 64, 0.3),
          2px 0 5px rgba(0, 180, 255, 0.3), 0 0 5px rgba(6, 182, 212, 0.2),
          inset 0 0 10px rgba(6, 182, 212, 0.05);
      }

      .control-button:hover {
        background-color: #374151;
        border-left: 2px solid #ff4080;
        border-right: 2px solid #40b4ff;
        box-shadow: -3px 0 10px rgba(255, 0, 64, 0.5),
          3px 0 10px rgba(0, 180, 255, 0.5);
      }

      .button-prefix {
        font-size: 0.75rem;
        line-height: 1.3;
        margin-bottom: 4px;
        opacity: 0.7;
      }

      .button-label {
        font-weight: bold;
        letter-spacing: 0.1em;
        font-size: 0.875rem;
        line-height: 1.3;
      }

      .button-indicator {
        width: 32px;
        height: 4px;
        margin-top: 4px;
        background-color: #0e7490;
        border-radius: 9999px;
      }

      .toggle-section {
        margin-bottom: 16px;
        background-color: #111827;
        padding: 12px;
        border-radius: 4px;
        border: 1px solid #134e4a;
        box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
      }

      .toggle-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }

      .toggle-row.music-row {
        flex-wrap: wrap;
      }

      .toggle-row .label-switch-container {
        display: flex;
        width: 100%;
        justify-content: space-between;
        align-items: center;
      }

      .toggle-row:last-child {
        margin-bottom: 0;
      }

      .toggle-label {
        font-size: 0.875rem;
        line-height: 1.4;
      }

      .toggle-switch {
        width: 48px;
        height: 24px;
        background-color: #1f2937;
        border-radius: 9999px;
        position: relative;
        padding: 2px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      .toggle-switch.active {
        background-color: #134e4a;
        box-shadow: 0 0 5px rgba(6, 182, 212, 0.5);
      }

      .toggle-switch.eighties.active {
        background-color: #4c1d95;
        box-shadow: 0 0 5px rgba(147, 51, 234, 0.5);
      }

      .toggle-switch.music.active {
        background-color: #ca8a04;
        box-shadow: 0 0 5px rgba(234, 179, 8, 0.5);
      }

      .toggle-switch.music:hover {
        box-shadow: 0 0 8px rgba(234, 179, 8, 0.7);
      }

      .toggle-handle {
        width: 18px;
        height: 18px;
        background-color: #e5e7eb;
        border-radius: 50%;
        position: absolute;
        top: 3px;
        left: 3px;
        transition: transform 0.3s;
      }

      .toggle-switch.active .toggle-handle {
        transform: translateX(24px);
      }

      .leaderboard-header {
        width: 100%;
        background-color: #1f2937;
        border-radius: 4px;
        border: 1px solid #134e4a;
        padding: 4px;
        font-family: monospace;
        color: #22d3ee;
        font-size: 0.75rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 4px;
        cursor: pointer;
        box-shadow: 0 0 5px rgba(6, 182, 212, 0.2);
      }

      .leaderboard-content {
        background-color: #111827;
        border-radius: 4px;
        border: 1px solid #134e4a;
        padding: 8px;
        font-family: monospace;
        color: #22d3ee;
        font-size: 0.875rem;
        margin-bottom: 12px;
        box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.7);
        background-image: linear-gradient(to bottom, #0c1721, #0a0f16);
      }

      .leaderboard-header-row {
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        margin-bottom: 4px;
        padding-bottom: 4px;
        border-bottom: 1px solid #1f2937;
      }

      .leaderboard-scrollable {
        height: 128px;
        overflow-y: auto;
        background-image: repeating-linear-gradient(
          transparent,
          transparent 1px,
          rgba(6, 182, 212, 0.03) 1px,
          rgba(6, 182, 212, 0.03) 2px
        );
        background-size: 100% 2px;
      }

      .leaderboard-entry {
        display: flex;
        justify-content: space-between;
        padding: 4px 0;
      }

      .leaderboard-entry.top {
        color: #67e8f9;
        font-weight: bold;
        text-shadow: 0 0 5px #06b6d4;
      }

      .leaderboard-footer {
        margin-top: 8px;
        font-size: 0.75rem;
        text-align: center;
        color: #22d3ee;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .pulse-dot {
        height: 4px;
        width: 4px;
        border-radius: 50%;
        background-color: #22d3ee;
        margin-right: 4px;
        animation: pulse 2s infinite;
      }

      .status-bar {
        margin-top: 16px;
        display: flex;
        justify-content: space-between;
      }

      .status-indicator {
        display: flex;
        align-items: center;
      }

      .status-light {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-right: 8px;
        background-color: #ef4444;
      }

      .status-light.active {
        background-color: #22d3ee;
        animation: pulse 2s infinite;
        box-shadow: 0 0 5px #06b6d4, 0 0 5px 2px rgba(255, 255, 255, 0.7),
          -2px 0 8px #ff0040, 2px 0 8px #00b4ff;
      }

      .status-label {
        font-size: 0.75rem;
      }

      .version-info {
        font-size: 0.75rem;
        color: #4b5563;
      }

      .spacer {
        flex-grow: 1;
      }

      @keyframes pulse {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0.5;
        }
        100% {
          opacity: 1;
        }
      }

      /* Hide scrollbar for Chrome, Safari and Opera */
      .leaderboard-scrollable::-webkit-scrollbar {
        display: none;
      }

      /* Hide scrollbar for IE, Edge and Firefox */
      .leaderboard-scrollable {
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }

      .control-button[data-action="launch"] {
        position: relative;
      }

      .control-button[data-action="launch"]:after {
        content: "";
        position: absolute;
        top: -2px;
        left: -2px;
        right: -2px;
        bottom: -2px;
        border-radius: 6px;
        background: transparent;
        transition: all 0.3s;
      }

      .control-button[data-action="launch"].active {
        background-color: #450a0a;
        border-color: #dc2626;
      }

      .control-button[data-action="launch"].active:after {
        background: linear-gradient(45deg, #dc2626, #450a0a);
        filter: blur(8px);
        opacity: 0.6;
        z-index: -1;
      }

      .control-button[data-action="launch"] .button-indicator {
        background-color: #dc2626;
        transition: all 0.3s;
      }

      .control-button[data-action="launch"].active .button-indicator {
        animation: redPulse 2s infinite;
      }

      .toggle-switch.emergency.active {
        background-color: #991b1b;
        box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
      }

      .toggle-switch.emergency.active .toggle-handle {
        background-color: #fecaca;
      }

      #vhss-aiplayer-aiformlogs {
        display: none !important;
        opacity: 0 !important;
      }

      /* 80s mode styles */
      .mission-control.eighties-active {
        /* background-image: linear-gradient(to bottom, #0b132b, #2a1786); */
        border-left: 1px solid #d946ef;
        box-shadow: 0 0 12px rgba(217, 70, 239, 0.3),
          inset 0 0 8px rgba(217, 70, 239, 0.1);
      }

      .eighties-active .panel-title {
        color: #d946ef;
        text-shadow: 0 0 3px #d946ef, 0 0 6px #d946ef;
        font-family: "Press Start 2P", cursive;
        font-size: 0.8rem; /* Slightly smaller to match height */
        line-height: 1.5; /* Adjusted line height */
      }

      .eighties-active .panel-subtitle {
        color: #22d3ee;
        font-family: "Press Start 2P", cursive;
        font-size: 0.6rem;
        line-height: 1.4;
      }

      .eighties-active .toggle-label,
      .eighties-active .button-label,
      .eighties-active .button-prefix,
      .eighties-active .status-label {
        font-family: "Press Start 2P", cursive;
        font-size: 0.6rem; /* Adjusted size */
        line-height: 1.5; /* Adjusted line height */
      }

      .eighties-active .control-button {
        border: 1px solid #d946ef !important; /* Consistent 1px border */
        padding: 12px !important; /* Use same padding as base */
        min-height: 62px !important; /* Ensure override for consistency */
        box-shadow: 0 0 3px rgba(217, 70, 239, 0.3) !important;
        background-image: linear-gradient(
          to bottom,
          #0f172a,
          #2a1786
        ) !important;
        border-left: 1px solid #d946ef !important;
        border-right: 1px solid #d946ef !important;
        transition: all 0.3s;
      }

      .eighties-active .control-button:hover {
        /* background-image: linear-gradient(to bottom, #2a1786, #0f172a); */
        transform: translateY(-2px);
        box-shadow: 0 0 6px rgba(217, 70, 239, 0.5);
      }

      .eighties-active .button-indicator {
        background-color: #d946ef;
        box-shadow: 0 0 3px #d946ef;
      }

      .eighties-active .toggle-section,
      .eighties-active .leaderboard-header,
      .eighties-active .leaderboard-content {
        border-color: #d946ef;
      }

      .eighties-active .status-light.active {
        background-color: #22d3ee;
        box-shadow: 0 0 6px #22d3ee;
        animation: flicker 2s infinite;
      }

      /* VHS glitch effect */
      /* @keyframes glitch {
        0% {
          transform: translate(0);
        }
        20% {
          transform: translate(-2px, 2px);
        }
        40% {
          transform: translate(-2px, -2px);
        }
        60% {
          transform: translate(2px, 2px);
        }
        80% {
          transform: translate(2px, -2px);
        }
        100% {
          transform: translate(0);
        }
      } */

      @keyframes flicker {
        0% {
          opacity: 1;
        }
        25% {
          opacity: 0.8;
        }
        30% {
          opacity: 1;
        }
        35% {
          opacity: 0.6;
        }
        40% {
          opacity: 1;
        }
        50% {
          opacity: 0.9;
        }
        75% {
          opacity: 1;
        }
        80% {
          opacity: 0.7;
        }
        100% {
          opacity: 1;
        }
      }

      .eighties-active .panel-title {
        animation: glitch 5s infinite;
      }

      /* Color shifting for VHS effect */
      .color-shift {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        mix-blend-mode: screen;
        pointer-events: none;
        opacity: 0;
        z-index: 998;
        transition: opacity 0.3s ease;
      }

      .color-shift.active {
        opacity: 0.02;
        animation: color-drift 8s infinite;
      }

      .color-shift-red {
        background-color: #ff0000;
        transform: translateX(-1px);
      }

      .color-shift-blue {
        background-color: #0000ff;
        transform: translateX(1px);
      }

      /* Scan line effect for 80s mode */
      .scan-lines {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.02) 50%,
          rgba(0, 0, 0, 0.08) 50%
        );
        background-size: 100% 4px;
        pointer-events: none;
        z-index: 999;
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .scan-lines.active {
        opacity: 0.7;
      }

      /* CRT power on/off effect */
      .crt-effect {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;

              <script type="text/javascript">
                // Replace verbose console logging with empty operations in production
                if (location.hostname !== "localhost") {
                  console.log = function () {};
                  console.debug = function () {};
                }

                // Global helper for SitePal API access
                window.sitePalHelper = {
                  initialized: false,

                  initApi: function () {
                    if (
                      typeof AI_vhost_stop === "function" &&
                      typeof AI_vhost_api === "function" &&
                      typeof AI_vhost_destroy === "function"
                    ) {
                      console.log("SitePal API functions accessed globally");
                      this.initialized = true;
                      return true;
                    }
                    return false;
                  },

                  startListening: function () {
                    if (this.initApi() || this.initialized) {
                      try {
                        console.log("Starting SitePal listening via helper");

                        // First try to find and click the mic button directly
                        const micButton = document.querySelector(
                          ".vhss-aiplayer-mic-p3"
                        );
                        if (micButton) {
                          console.log("Found mic button directly, clicking it");
                          micButton.click();
                          return true;
                        }

                        // If button not found, try using the API
                        if (typeof saySilent === "function") {
                          saySilent(0);
                        }
                        setTimeout(() => {
                          AI_vhost_api("startListening");
                        }, 300);
                        return true;
                      } catch (e) {
                        console.error("Error starting SitePal listening:", e);
                      }
                    }
                    return false;
                  },

                  stopListening: function () {
                    if (this.initApi() || this.initialized) {
                      try {
                        console.log("Stopping SitePal listening via helper");
                        AI_vhost_api("stopListening");
                        return true;
                      } catch (e) {
                        console.error("Error stopping SitePal listening:", e);
                      }
                    }
                    return false;
                  },
                };

                function initSitePal() {
                  console.log("Starting SitePal initialization...");

                  // Set a visible loading state
                  const sitepalContainer =
                    document.getElementById("sitepal-container");
                  if (sitepalContainer) {
                    sitepalContainer.innerHTML =
                      '<div id="vhss_aiPlayer" style="text-align: center; color: #67e8f9;">Loading AI Agent...</div>';
                  }

                  // Special iOS initialization path
                  if (isIOS || browserIsSafari) {
                    console.log("Using iOS-specific initialization path");
                    initSitePalOnIOS();
                    return;
                  }

                  // Clear any existing initialization
                  cleanupSitePal();

                  // Load the embed script if not present
                  if (typeof AI_vhost_embed !== "function") {
                    console.log("Loading SitePal embed script...");
                    const scriptEl = document.createElement("script");
                    scriptEl.src =
                      "//vhss-d.oddcast.com/vhost_embed_functions_v4.php?acc=9157686&js=1";
                    scriptEl.type = "text/javascript";
                    document.head.appendChild(scriptEl);

                    scriptEl.onload = function () {
                      console.log("SitePal embed script loaded");
                      setTimeout(performEmbed, 500);
                    };
                  } else {
                    console.log("SitePal embed script already loaded");
                    performEmbed();
                  }

                  function performEmbed() {
                    try {
                      console.log("Performing SitePal embed...");

                      // Set up scene loaded callback before embed
                      window.vh_sceneLoaded = function (sceneIndex, portal) {
                        console.log(
                          `vh_sceneLoaded callback fired for sceneIndex: ${sceneIndex}, portal: ${portal}`
                        );
                        window.sitepalSceneReady = true; // Set flag

                        // Fade out the transmission video
                        const deadAir = document.getElementById("deadAir");
                        if (deadAir) {
                          console.log(
                            "Scene loaded, fading out transmission video..."
                          );
                          deadAir.style.opacity = 0;
                          setTimeout(() => {
                            console.log(
                              "Pausing transmission video after fade."
                            );
                            deadAir.pause();
                          }, 500); // Matches CSS transition duration
                        }

                        // Attempt microphone activation *after* scene is loaded
                        console.log(
                          "Scene loaded, attempting microphone activation..."
                        );
                        activateMicrophone();

                        // Notify parent frame that SitePal is ready
                        window.parent.postMessage(
                          { type: "SITEPAL_READY" },
                          "*"
                        );

                        // Prime audio playback on iOS/Safari using silent speech
                        try {
                          console.log(
                            "Priming browser with silent playback..."
                          );
                          window.saySilent(0);
                        } catch (e) {
                          console.warn("saySilent(0) failed:", e);
                        }

                        // Make the character say "Greetings" (after delay)
                        setTimeout(() => {
                          try {
                            console.log("Now making AI say 'Greetings'...");
                            // Using sayText based on docs for initial greeting
                            sayText(
                              "Greetings, how can I help you today?",
                              8,
                              1,
                              6
                            );
                            /* // Previous sayAI call:
                            const response = sayAI(
                              "Greetings", // what to send to the AI
                              244, // voice ID
                              1, // language ID
                              3, // TTS engine ID
                              "", "", // Effects
                              "CB", // Vendor
                              "Bif" // Bot Name
                            );
                            console.log("sayAI('Greetings') status:", response);
                            */
                          } catch (e) {
                            console.error("Error calling sayText:", e);
                          }
                        }, 200); // 200ms delay
                      };

                      // Set up listening status callback (remains the same)
                      window.vh_listeningStatusUpdate = function (isListening) {
                        console.log(
                          "SitePal listening status update:",
                          isListening
                        );
                        window.parent.postMessage(
                          {
                            type: "SITEPAL_STATE_CHANGE",
                            isListening: isListening,
                          },
                          "*"
                        );
                      };

                      // Perform the embed
                      AI_vhost_embed(280, 180, 9157686, 244, 1, 1);

                      // Set up initialization check
                      let checkCount = 0;
                      const maxChecks = 20;

                      const checkInterval = setInterval(() => {
                        checkCount++;
                        console.log(
                          `Checking SitePal initialization (${checkCount}/${maxChecks})...`
                        );

                        if (window.sitepalInitialized) {
                          console.log("SitePal initialization confirmed");
                          clearInterval(checkInterval);
                          activateMicrophone();
                          return;
                        }

                        // Try to find the mic button
                        const micButton = document.querySelector(
                          ".vhss-aiplayer-mic-p3"
                        );
                        if (micButton) {
                          console.log("Found SitePal mic button!");
                          window.sitepalInitialized = true;
                          clearInterval(checkInterval);
                          window.parent.postMessage(
                            { type: "SITEPAL_READY" },
                            "*"
                          );
                          activateMicrophone();
                          return;
                        }

                        // Check iframes
                        const iframes = document.querySelectorAll("iframe");
                        for (let iframe of iframes) {
                          try {
                            const iframeDoc =
                              iframe.contentDocument ||
                              iframe.contentWindow.document;
                            const iframeMicButton = iframeDoc.querySelector(
                              ".vhss-aiplayer-mic-p3"
                            );
                            if (iframeMicButton) {
                              console.log(
                                "Found SitePal mic button in iframe!"
                              );
                              window.sitepalInitialized = true;
                              clearInterval(checkInterval);
                              window.parent.postMessage(
                                { type: "SITEPAL_READY" },
                                "*"
                              );
                              activateMicrophone();
                              return;
                            }
                          } catch (e) {
                            // Ignore iframe access errors
                          }
                        }

                        if (checkCount >= maxChecks) {
                          console.warn(
                            "SitePal initialization check timed out"
                          );
                          clearInterval(checkInterval);
                          // Try one last time
                          activateMicrophone();
                        }
                      }, 1000);
                    } catch (e) {
                      console.error("Error during SitePal embed:", e);
                    }
                  }
                }

                // New function to handle microphone activation
                function activateMicrophone() {
                  console.log("Attempting to activate microphone...");

                  // Try multiple approaches to activate the microphone
                  let success = false;

                  // 1. Try direct API call first
                  try {
                    if (typeof AI_vhost_api === "function") {
                      console.log("Using direct API call to start listening");
                      AI_vhost_api("startListening");
                      success = true;
                    }
                  } catch (e) {
                    console.warn("API call failed:", e);
                  }

                  // 2. Try finding and clicking the button directly
                  if (!success) {
                    const micButton = document.querySelector(

        );

      // --- Music Player Functions (Moved from MusicPlayer3 & adapted) ---

      function loadTrack(index, autoplay = false) {
        let trackName, trackUrl, firebasePath;

        if (isEightiesMode) {
          // Use 80s list
          if (index < 0 || index >= eightiesTrackUrls.length) {
            console.error("Invalid 80s track index:", index);
            return;
          }
          currentTrackIdx = index; // Only update index for 80s mode
          trackName = eightiesTrackNames[currentTrackIdx];
          trackUrl = eightiesTrackUrls[currentTrackIdx];
          firebasePath = eightiesFirebasePaths[currentTrackIdx];
          console.log(`Loading 80s track index: ${currentTrackIdx}`);
        } else {
          // Use Modern single track
          trackName = modernTrackName;
          trackUrl = modernTrackUrl;
          firebasePath = modernFirebasePath;
          console.log(`Loading modern track: ${trackName}`);
          // No need to update currentTrackIdx when in modern mode
        }

        // Reset playback state
        musicIsPlaying = false;
        updateStereoUI();
        stereoInfo.innerHTML =
          '<div class="stereo-track-info">LOADING...</div>'; // Show loading state

        // Define track paths (add your Firebase storage paths here)
        const localFallbackUrls = isEightiesMode
          ? eightiesTrackUrls
          : [modernTrackUrl]; // Adjust fallback based on mode
        const firebasePaths = isEightiesMode
          ? eightiesFirebasePaths
          : [modernFirebasePath]; // Adjust paths based on mode
        const currentPathIndex = isEightiesMode ? currentTrackIdx : 0; // Use index 0 for modern path

        // Function to set audio source and attach listeners
        const setAudioSource = (url) => {
          console.log(`Setting audio source to: ${url}`);

          try {
            // Check if this is a Firebase URL or a local path
            if (url.startsWith("http") || url.startsWith("blob:")) {
              // Direct Firebase or blob URL - use as is
              audioPlayer.src = url;
            } else {
              // Local file path - ensure proper formatting
              // Make relative to server root with leading slash
              const formattedUrl = url.startsWith("/") ? url : `/${url}`;
              console.log(`Formatted local URL: ${formattedUrl}`);
              audioPlayer.src = formattedUrl;
            }

            audioPlayer.load();

            // Reset error count for this track
            audioPlayer._errorCount = 0;
          } catch (e) {
            console.error("Error setting audio source:", e);
            stereoInfo.innerHTML =
              '<div class="stereo-track-info">ERROR LOADING TRACK</div>';
            return;
          }

          audioPlayer.onloadedmetadata = () => {
            console.log("Metadata loaded for:", trackName);
            updateTrackInfoDisplay();
            if (autoplay && isMusicActive) {
              audioPlayer
                .play()
                .then(() => {
                  console.log("Audio playback started successfully");
                  musicIsPlaying = true;
                  updateStereoUI();
                })
                .catch((e) => {
                  console.error("Autoplay failed:", e);
                  musicIsPlaying = false;
                  updateStereoUI();
                });
            }
          };

          audioPlayer.onerror = (e) => {
            console.error("Audio error:", e, "URL:", url);
            // Count errors to prevent infinite loops
            audioPlayer._errorCount = (audioPlayer._errorCount || 0) + 1;

            // If Firebase URL failed and we haven't tried too many times, try local fallback
            if (
              url.includes("firebasestorage") &&
              localFallbackUrls[currentPathIndex] &&
              audioPlayer._errorCount < 3
            ) {
              console.warn(
                "Firebase audio failed, trying local fallback:",
                localFallbackUrls[currentPathIndex]
              );
              const localUrl = localFallbackUrls[currentPathIndex];
              // Use absolute path for local files
              const formattedUrl = localUrl.startsWith("/")
                ? localUrl
                : `/${localUrl}`;
              audioPlayer.src = formattedUrl;
              audioPlayer.load();
            } else {
              stereoInfo.innerHTML =
                '<div class="stereo-track-info">AUDIO ERROR</div>';
              musicIsPlaying = false;
              updateStereoUI();
            }
          };

          // Rest of the listeners
          audioPlayer.onplay = () => {
            musicIsPlaying = true;
            updateStereoUI();
            console.log("Playing:", trackName);
          };

          audioPlayer.onpause = () => {
            musicIsPlaying = false;
            updateStereoUI();
            console.log("Paused:", trackName);
          };

          audioPlayer.onended = () => {
            console.log("Track ended:", trackName);
            changeTrack(1);
          };

          audioPlayer.ontimeupdate = () => {
            updateTrackInfoDisplay();
          };
        };

        // Because of CORS issues, use local files directly
        console.log(
          "Using local audio file:",
          localFallbackUrls[currentPathIndex]
        );
        setAudioSource(localFallbackUrls[currentPathIndex]);

        // Try fetching from Firebase Storage first
        if (
          storage &&
          firebasePaths[currentPathIndex] &&
          !window.location.hostname.includes("localhost")
        ) {
          // Only try Firebase if not on localhost
          try {
            console.log(
              "Attempting to fetch from Firebase Storage:",
              firebasePaths[currentPathIndex]
            );
            const storageRef = storage.ref(firebasePaths[currentPathIndex]);

            storageRef
              .getDownloadURL()
              .then((url) => {
                console.log("Successfully fetched Firebase Storage URL:", url);
                setAudioSource(url);

                // Update the track info immediately to give feedback
                const trackInfoElement =
                  stereoInfo.querySelector(".stereo-track-info");
                if (trackInfoElement) {
                  trackInfoElement.textContent = `Loading ${trackName}...`;
                }
              })
              .catch((error) => {
                console.error("Firebase Storage getDownloadURL error:", error);
                console.warn(
                  "Falling back to local URL:",
                  localFallbackUrls[currentPathIndex]
                );
                setAudioSource(localFallbackUrls[currentPathIndex]); // Fallback to local
              });
          } catch (e) {
            console.error("Error accessing Firebase Storage:", e);
            setAudioSource(localFallbackUrls[currentPathIndex]);
          }
        } else {
          // If on localhost, storage not initialized, or no Firebase path, use local directly
          const reason = window.location.hostname.includes("localhost")
            ? "Running on localhost"
            : "Firebase Storage not available or path missing";

          console.warn(
            `${reason}, using local URL:`,
            localFallbackUrls[currentPathIndex]
          );
          setAudioSource(localFallbackUrls[currentPathIndex]);
        }
      }

      function changeTrack(direction) {
        // Only change tracks if in 80s mode
        if (!isEightiesMode) {
          console.log("Track change ignored: Not in 80s mode.");
          return;
        }
        let nextIndex =
          (currentTrackIdx + direction + eightiesTrackUrls.length) %
          eightiesTrackUrls.length;
        loadTrack(nextIndex, musicIsPlaying || isMusicActive); // Autoplay if player was already playing OR if just powered on
      }

      function togglePlayPause() {
        if (!isMusicActive) {
          console.log("Cannot play/pause, stereo not active.");
          return;
        }

        if (!audioPlayer.src) {
          console.log("No track loaded, loading default track.");
          loadTrack(currentTrackIdx, true);
          return;
        }

        if (audioPlayer.readyState < 2) {
          console.log("Audio not ready yet, waiting for metadata.");
          // Show loading indicator
          const trackInfoElement =
            stereoInfo.querySelector(".stereo-track-info");
          if (trackInfoElement) {
            trackInfoElement.textContent = "LOADING...";
          }

          // Set a listener to play when ready
          audioPlayer.oncanplay = () => {
            audioPlayer
              .play()
              .then(() => {
                console.log("Delayed play successful");
                musicIsPlaying = true;
                updateStereoUI();
              })
              .catch((e) => console.error("Delayed play failed:", e));
            audioPlayer.oncanplay = null; // Remove listener after use
          };

          return;
        }

        if (musicIsPlaying) {
          audioPlayer.pause();
        } else {
          audioPlayer
            .play()
            .then(() => {
              console.log("Play successful");
            })
            .catch((e) => {
              console.error("Play failed:", e);
              // Try re-initializing audio on error
              if (storage && firebaseInitialized) {
                console.log("Attempting to reload track after play error");
                loadTrack(currentTrackIdx, true);
              }
            });
        }
        // State update handled by onplay/onpause events
      }

      function updateTrackInfoDisplay() {
        if (!audioPlayer || !audioPlayer.src) return;

        const currentTime = formatTime(audioPlayer.currentTime);
        const duration = isNaN(audioPlayer.duration)
          ? "00:00"
          : formatTime(audioPlayer.duration);

        // Get the correct track name based on the mode
        const trackName = isEightiesMode
          ? eightiesTrackNames[currentTrackIdx] || "Loading..."
          : modernTrackName;

        // Find the inner element to update its content
        const trackInfoElement = stereoInfo.querySelector(".stereo-track-info");
        if (!trackInfoElement) {
          console.error(
            ".stereo-track-info element not found inside #stereo-info"
          );
          return;
        }

        // Construct the text content
        let displayText = `${trackName} [${currentTime} / ${duration}]`;
        if (isEightiesMode) {
          displayText = `▶ ${trackName} [${currentTime} / ${duration}]`;
        }

        // Update the text content of the inner element
        trackInfoElement.textContent = displayText;
      }

      function formatTime(seconds) {
        if (isNaN(seconds) || seconds < 0) return "00:00";
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${String(mins).padStart(2, "0")}:${String(secs).padStart(
          2,
          "0"
        )}`;
      }

      function playStereoSound(isPoweringOn) {
        // Simplified sound effect for power toggle
        try {
          const audioContext = new (window.AudioContext ||
            window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();
          oscillator.type = "sine";
          if (isPoweringOn) {
            oscillator.frequency.setValueAtTime(
              261.63,
              audioContext.currentTime
            ); // C4
            oscillator.frequency.exponentialRampToValueAtTime(
              392.0,
              audioContext.currentTime + 0.2
            ); // G4
          } else {
            oscillator.frequency.setValueAtTime(
              392.0,
              audioContext.currentTime
            ); // G4
            oscillator.frequency.exponentialRampToValueAtTime(
              261.63,
              audioContext.currentTime + 0.2
            ); // C4
          }
          gainNode.gain.setValueAtTime(0.1, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(
            0.01,
            audioContext.currentTime + 0.3
          );
          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);
          oscillator.start();
          oscillator.stop(audioContext.currentTime + 0.3);
        } catch (e) {
          console.log("Audio context error:", e);
        }
      }

      // --- End Music Player Functions ---

      function playClickSound() {
        try {
          const audioContext = new (window.AudioContext ||
            window.webkitAudioContext)();
          const oscillator = audioContext.createOscillator();
          const gainNode = audioContext.createGain();

          oscillator.type = "square";
          oscillator.frequency.setValueAtTime(880, audioContext.currentTime); // A5

          gainNode.gain.setValueAtTime(0.05, audioContext.currentTime);
          gainNode.gain.exponentialRampToValueAtTime(
            0.01,
            audioContext.currentTime + 0.1
          );

          oscillator.connect(gainNode);
          gainNode.connect(audioContext.destination);

          oscillator.start();
          oscillator.stop(audioContext.currentTime + 0.1);
        } catch (e) {
          console.log("Audio context not supported");
        }
      }

          try {

            // Then try finding the button
            const micButton = document.querySelector(".vhss-aiplayer-mic-p3");
            if (micButton) {
              console.log("iOS: Found mic button, simulating touch");

              // For iOS, simulate both click and touch events
              micButton.dispatchEvent(
                new MouseEvent("mousedown", {
                  bubbles: true,
                  cancelable: true,
                  view: window,
                })
              );

              micButton.dispatchEvent(
                new MouseEvent("click", {
                  bubbles: true,
                  cancelable: true,
                  view: window,
                })
              );

              // iOS Safari may not support TouchEvent constructor
              try {
                // Check if TouchEvent constructor exists
                if (typeof TouchEvent === "function") {
                  micButton.dispatchEvent(
                    new TouchEvent("touchstart", {
                      bubbles: true,
                      cancelable: true,
                      view: window,
                      touches: [
                        new Touch({
                          identifier: Date.now(),
                          target: micButton,
                          clientX: 10,
                          clientY: 10,
                          screenX: 10,
                          screenY: 10,
                          pageX: 10,
                          pageY: 10,
                          radiusX: 2,
                          radiusY: 2,
                        }),
                      ],
                    })
                  );
                } else {
                  // Fallback for browsers that don't support TouchEvent constructor
                  console.log(
                    "TouchEvent constructor not supported, using alternative approach"
                  );

                  // Create and dispatch a synthetic touchstart event
                  const touchEvent = document.createEvent("Event");
                  touchEvent.initEvent("touchstart", true, true);
                  micButton.dispatchEvent(touchEvent);
                }
              } catch (e) {
                console.error("Error creating touch event:", e);
              }

              // Even if these don't work, we'll return true to update the UI
              return true;
            }
          } catch (e) {
            console.error("iOS mic button error:", e);
          }

          // For iOS, we'll pretend we succeeded to update the UI
          return true;
        }

        // Standard path for non-iOS devices
        // Try to find the button in the document
        const micButton = document.querySelector(".vhss-aiplayer-mic-p3");
        if (micButton) {
          console.log("Found SitePal mic button in document, clicking it");
          micButton.click();
          return true;
        }

        // Try to find in iframes
        const iframes = document.querySelectorAll("iframe");
        for (let i = 0; i < iframes.length; i++) {
          try {
            const iframeDoc =
              iframes[i].contentDocument || iframes[i].contentWindow.document;
            const iframeMicButton = iframeDoc.querySelector(
              ".vhss-aiplayer-mic-p3"
            );
            if (iframeMicButton) {
              console.log(
                `Found SitePal mic button in iframe ${i}, clicking it`
              );
              iframeMicButton.click();
              return true;
            }
          } catch (e) {
            console.warn(`Cannot access iframe ${i} content:`, e);
          }
        }

        return false;
      }

            console.log("Calling stopSpeaking...");
            AI_vhost_api("stopSpeaking");
            console.log("Calling stopListening...");
            AI_vhost_api("stopListening");
            console.log("Calling unloadScene...");
            AI_vhost_api("unloadScene");

          // Also call the older stop function for robustness
          if (typeof AI_vhost_stop === "function") {
            console.log("Calling AI_vhost_stop()...");
            AI_vhost_stop();
          }

          // Clear the container
          const container = document.getElementById("vhss_aiPlayer");
          if (container) {
            container.innerHTML = "";

          // Remove any lingering iframes
          const iframes = document.querySelectorAll("#SitePal iframe");
          iframes.forEach((iframe) => {
            iframe.src = "about:blank";
            iframe.remove();

          // Reset state
          window.sitepalInitialized = false;

          return true;
        } catch (e) {
          console.error("Error during cleanup:", e);
          return false;
        }

        // Maybe combine them or ensure they don't clash.

            case "SET_MUSIC_PLAYER_STATE":

            // MUSIC_PLAYER3_TRACK_INFO is obsolete

            case "SET_SHOW_SPOTIFY": // From Parent controlling Spotify visibility

              if (!isEightiesMode) {

              );

            // Existing message cases like ACTIVATE_SITEPAL_MIC, SITEPAL_API_CALL should remain if still needed

              // Log unhandled message types
              // Avoid logging the config response here again
              if (event.data.type !== "FIREBASE_CONFIG_RESPONSE") {
                console.log("Unhandled message type:", event.data.type);
              }
              break;
          }
        }
      });

      // Toggle Leaderboard
      leaderboardToggle.addEventListener("click", () => {
