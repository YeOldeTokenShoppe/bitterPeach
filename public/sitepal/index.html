<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SitePal Avatar</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: transparent;
        width: 100%;
        height: 100%;
      }
      /* Hide the original SitePal mic/status controls */
      .vhss-aiplayer-aiform-mic {
        display: none !important;
      }
      /* Hide the SitePal dialog/log text boxes */
      #vhss-aiplayer-aiformlogs {
        display: none !important;
        opacity: 0 !important; /* Add opacity just in case display is overridden */
      }
    </style>
  </head>
  <body>
    <div id="vhss_aiPlayer"></div>

    <script
      type="text/javascript"
      src="//vhss-d.oddcast.com/ai_embed_functions_v1.php"
    ></script>
    <script type="text/javascript">
      // Wait for the script to load before attempting to use it
      window.addEventListener("load", function () {
        try {
          // Use your actual SitePal embed parameters here
          AI_vhost_embed(800, 600, 9157686, 244, 1, 1);

          // Let the parent frame know the SitePal is ready
          window.parent.postMessage({ type: "SITEPAL_READY" }, "*");

          // Listen for activation messages from parent
          window.addEventListener("message", function (event) {
            if (event.data && event.data.action === "activateListening") {
              if (typeof AI_startListening === "function") {
                AI_startListening();
                window.parent.postMessage(
                  {
                    type: "SITEPAL_STATE_CHANGE",
                    isListening: true,
                  },
                  "*"
                );
              } else if (typeof AI_callAI === "function") {
                AI_callAI();
                window.parent.postMessage(
                  {
                    type: "SITEPAL_STATE_CHANGE",
                    isListening: true,
                  },
                  "*"
                );
              }
            }

            // Check for the specific message to trigger the click
            if (event.data === "triggerListenClick") {
              console.log(`Message received from parent: triggerListenClick`);

              const targetElementId = "vhss-aiplayer-mic-p3"; // Target the element you identified
              const targetElement = document.getElementById(targetElementId);

              // Check if the element exists
              if (targetElement) {
                try {
                  console.log(`Attempting to click #${targetElementId}...`);
                  targetElement.click(); // Click the element
                  console.log(`Successfully clicked #${targetElementId}`);
                } catch (error) {
                  console.error(`Error clicking #${targetElementId}:`, error);
                }
              } else {
                console.error(
                  `Element #${targetElementId} not found initially. Will poll...`
                );
                let attempts = 0;
                const maxAttempts = 20; // Poll for 5 seconds (20 * 250ms)
                const intervalId = setInterval(() => {
                  attempts++;
                  const currentTargetElement =
                    document.getElementById(targetElementId);
                  if (currentTargetElement) {
                    clearInterval(intervalId);
                    console.log(
                      `Element #${targetElementId} found after ${
                        attempts * 250
                      }ms.`
                    );
                    try {
                      console.log(`Attempting to click #${targetElementId}`);
                      currentTargetElement.click();
                      console.log(`Successfully clicked #${targetElementId}`);
                    } catch (error) {
                      console.error(
                        `Error clicking #${targetElementId}:`,
                        error
                      );
                    }
                  } else if (attempts >= maxAttempts) {
                    clearInterval(intervalId);
                    console.error(
                      `Element #${targetElementId} still not found after ${
                        maxAttempts * 250
                      }ms.`
                    );
                  }
                }, 250); // Check every 250ms
              }
            }
          });
        } catch (e) {
          console.error("Error initializing SitePal:", e);
          window.parent.postMessage(
            {
              type: "SITEPAL_ERROR",
              error: e.toString(),
            },
            "*"
          );
        }
      });
    </script>
  </body>
</html>
