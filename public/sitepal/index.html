<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SitePal Avatar</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: transparent;
        width: 100%;
        height: 100%;
      }

      .vhss-aiplayer-aiform-mic {
        display: none !important;
      }

      #vhss-aiplayer-aiformlogs {
        display: none !important;
        opacity: 0 !important;
      }
    </style>
  </head>
  <body>
    <div id="vhss_aiPlayer"></div>
    <script
      type="text/javascript"
      src="//vhss-d.oddcast.com/ai_embed_functions_v1.php"
    ></script>
    <script type="text/javascript">
      // Global sceneLoaded flag
      let sceneLoaded = false;

      // Define the callback that SitePal will call when scene is ready
      function vh_sceneLoaded() {
        sceneLoaded = true;

        // Prime audio playback on iOS/Safari using silent speech
        try {
          window.saySilent(0);
        } catch (e) {
          console.warn("saySilent(0) failed:", e);
        }

        // Notify parent that scene is loaded
        window.parent.postMessage(
          {
            type: "SITEPAL_SCENE_LOADED",
            status: "ready",
          },
          "*"
        );
      }

      window.addEventListener("load", function () {
        try {
          // iOS-specific audio context initialization
          let audioContext;
          try {
            const AudioContext =
              window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
              audioContext = new AudioContext();
              // Create a silent audio buffer to ensure audio context is active
              const buffer = audioContext.createBuffer(1, 1, 22050);
              const source = audioContext.createBufferSource();
              source.buffer = buffer;
              source.connect(audioContext.destination);
              // Resume audio context immediately
              audioContext.resume().catch((e) => {});
            }
          } catch (e) {}

          // Check that the AI_vhost_embed function exists
          if (typeof AI_vhost_embed === "undefined") {
            throw new Error("AI_vhost_embed function not found");
          }

          // Initialize SitePal with explicit parameters
          AI_vhost_embed(800, 600, 9157686, 244, 1, 1);

          // Notify parent of ready state
          window.parent.postMessage(
            {
              type: "SITEPAL_READY",
              status: "initialized",
              audioContext: !!audioContext,
            },
            "*"
          );

          // Enhanced message listener with iOS-specific handling
          window.addEventListener("message", function (event) {
            if (!event.data || !event.data.type) return;

            switch (event.data.type) {
              case "PRIME_AUDIO_IOS":
                // Prime audio playback on iOS/Safari using silent speech
                try {
                  if (typeof window.saySilent === "function" && sceneLoaded) {
                    window.saySilent(0);
                  }
                } catch (e) {}
                break;

              case "ACTIVATE_SITEPAL_MIC":
                if (!sceneLoaded) return;

                // Ensure audio context is running
                if (audioContext && audioContext.state === "suspended") {
                  audioContext.resume().catch(() => {});
                }

                // Try to activate the microphone
                try {
                  if (typeof activateMicrophone === "function") {
                    activateMicrophone();
                  } else {
                    // Fallback to click simulation
                    const micButton = document.querySelector(
                      ".vhss-aiplayer-mic, #vhss-aiplayer-mic"
                    );
                    if (micButton) {
                      micButton.click();
                    }
                  }

                  window.parent.postMessage(
                    {
                      type: "SITEPAL_STATE_CHANGE",
                      isListening: true,
                    },
                    "*"
                  );
                } catch (e) {
                  window.parent.postMessage(
                    {
                      type: "SITEPAL_ERROR",
                      error: e.toString(),
                    },
                    "*"
                  );
                }
                break;

              case "DISCONNECT_SITEPAL":
                // Handle disconnect request
                try {
                  if (typeof stopListening === "function") {
                    stopListening();
                  }
                } catch (e) {}
                break;
            }
          });
        } catch (e) {
          window.parent.postMessage(
            {
              type: "SITEPAL_ERROR",
              error: e.toString(),
            },
            "*"
          );
        }
      });
    </script>
  </body>
</html>
