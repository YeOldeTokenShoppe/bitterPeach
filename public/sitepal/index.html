<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SitePal Avatar</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: transparent;
        width: 100%;
        height: 100%;
      }
      /* Hide the original SitePal mic/status controls */
      .vhss-aiplayer-aiform-mic {
        display: none !important;
      }
      /* Hide the SitePal dialog/log text boxes */
      #vhss-aiplayer-aiformlogs {
        display: none !important;
        opacity: 0 !important; /* Add opacity just in case display is overridden */
      }
    </style>
  </head>
  <body>
    <div id="vhss_aiPlayer"></div>

    <script
      type="text/javascript"
      src="//vhss-d.oddcast.com/ai_embed_functions_v1.php"
    ></script>
    <script type="text/javascript">
      window.addEventListener("load", function () {
        try {
          console.log("SitePal iframe loaded, initializing...");

          // Add iOS-specific audio context initialization
          let audioContext;
          try {
            const AudioContext =
              window.AudioContext || window.webkitAudioContext;
            if (AudioContext) {
              audioContext = new AudioContext();

              // Create a silent audio buffer to ensure audio context is active
              const buffer = audioContext.createBuffer(1, 1, 22050);
              const source = audioContext.createBufferSource();
              source.buffer = buffer;
              source.connect(audioContext.destination);

              // Resume audio context immediately
              audioContext
                .resume()
                .then(() => {
                  console.log("Audio context resumed successfully");
                })
                .catch((e) => {
                  console.log("Failed to resume audio context:", e);
                });

              console.log(
                "Audio context initialized with sample rate:",
                audioContext.sampleRate
              );
            }
          } catch (e) {
            console.log("Audio context initialization failed:", e);
          }

          // Add a check to ensure the AI_vhost_embed function exists
          if (typeof AI_vhost_embed === "undefined") {
            throw new Error("AI_vhost_embed function not found");
          }

          // Initialize SitePal with explicit parameters
          AI_vhost_embed(800, 600, 9157686, 244, 1, 1);
          console.log("SitePal initialized successfully");

          // Notify parent of ready state
          window.parent.postMessage(
            {
              type: "SITEPAL_READY",
              status: "initialized",
              audioContext: !!audioContext,
              sampleRate: audioContext ? audioContext.sampleRate : null,
              state: audioContext ? audioContext.state : null,
            },
            "*"
          );

          // Enhanced message listener with iOS-specific handling
          window.addEventListener("message", function (event) {
            console.log("SitePal received message:", event.data);

            if (event.data === "triggerListenClick") {
              console.log("Attempting to trigger listen click...");

              // Ensure audio context is running
              if (audioContext && audioContext.state === "suspended") {
                audioContext
                  .resume()
                  .then(() => {
                    console.log("Audio context resumed for click");
                  })
                  .catch((e) => {
                    console.log("Failed to resume audio context for click:", e);
                  });
              }

              // Try multiple possible element IDs
              const possibleIds = [
                "vhss-aiplayer-mic-p3",
                "vhss-aiplayer-mic",
                "vhss-aiplayer-aiform-mic",
              ];

              const findAndClickElement = (id) => {
                const element = document.getElementById(id);
                if (element) {
                  console.log(`Found element with ID: ${id}`);

                  // Create and dispatch a more complete click event
                  const clickEvent = new MouseEvent("click", {
                    view: window,
                    bubbles: true,
                    cancelable: true,
                    clientX: 0,
                    clientY: 0,
                    screenX: 0,
                    screenY: 0,
                  });

                  // Try multiple event types with proper coordinates
                  element.dispatchEvent(
                    new MouseEvent("mousedown", {
                      bubbles: true,
                      clientX: 0,
                      clientY: 0,
                      screenX: 0,
                      screenY: 0,
                    })
                  );

                  element.dispatchEvent(clickEvent);

                  element.dispatchEvent(
                    new MouseEvent("mouseup", {
                      bubbles: true,
                      clientX: 0,
                      clientY: 0,
                      screenX: 0,
                      screenY: 0,
                    })
                  );

                  // Try touch events with proper coordinates
                  element.dispatchEvent(
                    new TouchEvent("touchstart", {
                      bubbles: true,
                      touches: [
                        { clientX: 0, clientY: 0, screenX: 0, screenY: 0 },
                      ],
                    })
                  );

                  element.dispatchEvent(
                    new TouchEvent("touchend", {
                      bubbles: true,
                      touches: [
                        { clientX: 0, clientY: 0, screenX: 0, screenY: 0 },
                      ],
                    })
                  );

                  // Finally try the native click
                  element.click();

                  return true;
                }
                return false;
              };

              // Try each possible ID with a small delay between attempts
              for (let i = 0; i < possibleIds.length; i++) {
                const id = possibleIds[i];
                setTimeout(() => {
                  if (findAndClickElement(id)) {
                    console.log(`Successfully clicked element: ${id}`);
                    // Add a small delay before sending the state change
                    setTimeout(() => {
                      window.parent.postMessage(
                        {
                          type: "SITEPAL_STATE_CHANGE",
                          isListening: true,
                          elementClicked: id,
                          audioContext: audioContext
                            ? audioContext.state
                            : "none",
                          sampleRate: audioContext
                            ? audioContext.sampleRate
                            : null,
                        },
                        "*"
                      );
                    }, 100);
                  }
                }, i * 100);
              }
            }
          });
        } catch (e) {
          console.error("Error in SitePal initialization:", e);
          window.parent.postMessage(
            {
              type: "SITEPAL_ERROR",
              error: e.toString(),
            },
            "*"
          );
        }
      });

      const checkSitePalInitialization = () => {
        if (!sitepalIframeRef.current) {
          console.error("SitePal iframe not found");
          return false;
        }

        try {
          // Try to access the iframe's contentWindow
          const iframeWindow = sitepalIframeRef.current.contentWindow;
          if (!iframeWindow) {
            console.error("Cannot access iframe contentWindow");
            return false;
          }
          return true;
        } catch (error) {
          console.error("Error checking SitePal initialization:", error);
          return false;
        }
      };
    </script>
  </body>
</html>
